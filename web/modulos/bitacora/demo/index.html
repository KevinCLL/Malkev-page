<title>Bitácora del capitán</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Exo+2:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Sala de la bitácora: cúpula de observación de la nave con un arco de holopaneles alrededor de quien mira.
   Índice a la derecha (hoja inferior en móvil). Un único look oscuro, el de la cabina. */
:root{
  --void:#07050f; --panel:rgba(16,10,32,.8); --line:rgba(255,194,122,.26); --line2:rgba(181,155,255,.22);
  --text:#f3ecff; --muted:#b4a6d8; --amber:#ffc27a; --violet:#b59bff; --cyan:#7fd6ff;
  --f-display:"Orbitron","Exo 2",system-ui,sans-serif; --f-body:"Exo 2",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--text);font-family:var(--f-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.drag{cursor:grabbing} #c.pt{cursor:pointer}
.hud{position:fixed;z-index:5}
#id{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:min(340px,calc(100vw - 32px));pointer-events:none}
#id .eb{font:600 10px var(--f-mono);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
#id h1{margin:4px 0 0;font:700 21px var(--f-display);letter-spacing:.05em;color:var(--amber);text-wrap:balance}
#id p{margin:4px 0 0;font:400 13px var(--f-body);color:var(--muted)}
#dock{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.pill{display:flex;align-items:center;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--text);font:600 17px var(--f-mono);cursor:pointer}
.pill button:hover:not(:disabled){background:rgba(255,194,122,.14)}
.pill button:disabled{opacity:.3;cursor:default}
.pill span{font:400 12px var(--f-mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font:400 11.5px var(--f-mono);color:var(--muted);letter-spacing:.03em;text-shadow:0 1px 6px #000}
.hint b{color:var(--text);font-weight:600}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#side{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:340px;
  display:grid;grid-template-rows:auto 1fr;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#side header{display:flex;justify-content:space-between;align-items:center}
#side header .eb{font:600 10px var(--f-mono);letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
#side .mount{min-height:0}
#toggle{display:none}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;display:none}
#mhint{display:none}
#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding-inline:16px;background:var(--void);font:400 13px var(--f-mono);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;text-align:center;transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#boot i{display:block;width:120px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--amber),transparent);background-size:200% 100%;animation:scan 1.4s linear infinite}
#boot.err i{display:none} #boot.err{color:var(--amber);letter-spacing:.08em;text-transform:none;font-size:14px}
@keyframes scan{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#boot i{animation:none}}
body.nogl #side{left:max(16px,env(safe-area-inset-left,0px));width:auto;max-width:720px;margin:0 auto;top:calc(120px + env(safe-area-inset-top,0px))}
body.nogl #dock{display:none}
@media (max-width:820px){
  #id{padding:10px 14px} #id h1{font-size:17px}
  .hint{display:none}
  #mhint{display:block;position:fixed;z-index:4;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));text-align:center;padding-inline:16px;pointer-events:none;transition:opacity .8s}
  #mhint.off{opacity:0}
  #side{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;width:auto;height:min(64vh,560px);height:min(64dvh,560px);
    transform:translateY(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;visibility:hidden}
  #side.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #toggle{display:block;position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
    padding:11px 18px;border-radius:999px;border:1px solid var(--amber);background:var(--panel);color:var(--text);font:600 13px var(--f-mono);letter-spacing:.08em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
  .x{display:block}
  body.nogl #side{transform:none;visibility:visible;height:auto;top:calc(110px + env(safe-area-inset-top,0px))}
  body.nogl #toggle,body.nogl .x,body.nogl #mhint{display:none}
}
@media (max-width:820px) and (prefers-reduced-motion:reduce){#side,#side.open{transition:none}}
</style>

<canvas id="c" tabindex="-1" aria-label="Sala de la bitácora: holopaneles con las entradas del blog. El índice de la derecha permite lo mismo con teclado."></canvas>

<div class="hud" id="id">
  <div class="eb">La Malkevnia · El diario de a bordo</div>
  <h1>Bitácora del capitán</h1>
  <p id="sub">Sintonizando entradas…</p>
</div>

<div class="hud" id="dock">
  <div class="pill" role="group" aria-label="Páginas del muro">
    <button type="button" id="prev" aria-label="Página anterior">‹</button>
    <span id="pg" aria-live="polite">1 / 1</span>
    <button type="button" id="next" aria-label="Página siguiente">›</button>
  </div>
  <div class="hint"><b>Arrastra</b> para girar · <b>clic</b> en un panel para leer · <b>← →</b> columnas · <b>/</b> buscar</div>
</div>
<div id="mhint" class="hint"><b>Desliza</b> para girar · <b>toca</b> un panel para leerlo</div>

<aside class="hud" id="side" aria-label="Índice de la bitácora">
  <header><span class="eb">Índice de entradas</span><button type="button" class="x" id="closeSide" aria-label="Cerrar el índice">✕</button></header>
  <div class="mount" id="mount"></div>
</aside>
<button type="button" id="toggle" aria-controls="side" aria-expanded="false">Índice</button>

<div id="boot" role="status"><div id="bootMsg">Sintonizando la bitácora<i></i></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
// La demo vive junto a bitacora.js y posts.json (Artifact) o dentro de modulos/bitacora/demo/ (carpeta del proyecto).
const $ = (id) => document.getElementById(id);
const fail = (msg) => { $('boot').classList.add('err'); $('bootMsg').textContent = msg; };
const firstOk = async (paths) => { for (const p of paths) { try { const r = await fetch(p); if (r.ok) return r; } catch { /* siguiente */ } } return null; };

let B;
try { B = await import('./bitacora.js'); } catch { try { B = await import('../bitacora.js'); } catch { B = null; } }
const postsRes = B && await firstOk(['./posts.json', '../posts.json']);
if (!B || !postsRes) {
  fail('No se ha podido cargar la bitácora. Recarga la página para volver a intentarlo.');
} else {
  // imágenes y audios publicados junto a la demo; si no están, se usan los de malkevnia.com
  const manifest = await (await firstOk(['./assets/manifest.json']))?.json().catch(() => ({})) ?? {};
  const mapAsset = (u) => {
    const m = /^https:\/\/malkevnia\.com\/(assets\/.+)$/.exec(u || '');
    if (!m) return u;
    let key = m[1];
    try { key = decodeURIComponent(key); } catch { /* tal cual */ }
    key = key.normalize('NFC');
    return manifest[key] ? './' + manifest[key] : u;
  };
  start(B, await B.loadPosts(await postsRes.json()), mapAsset).catch((e) => { console.error(e); fail('Algo falló al preparar la sala. Recarga la página para volver a intentarlo.'); });
}

async function start({ createReader, createBrowser, createHoloWall, FONTS }, posts, mapAsset) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const narrow = matchMedia('(max-width:820px)');
  let renderer = null, renderOnce = true;
  const years = posts.map((p) => p.year);
  $('sub').textContent = `${posts.length} entradas de malkevnia.com, de ${Math.min(...years)} a ${Math.max(...years)}`;
  $('toggle').textContent = `Índice · ${posts.length}`;

  // tipografías listas antes de pintar los paneles (si tardan, el muro se repinta solo al llegar)
  await Promise.race([Promise.all(FONTS.map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]).catch(() => {});

  // índice lateral / hoja inferior
  const side = $('side');
  const setSide = (open) => {
    side.classList.toggle('open', open);
    $('toggle').setAttribute('aria-expanded', String(open));
    side.inert = narrow.matches && !open;
    if (open && narrow.matches) $('closeSide').focus({ preventScroll: true });
  };
  side.inert = narrow.matches;
  narrow.addEventListener('change', () => { side.inert = narrow.matches && !side.classList.contains('open'); if (renderer) resize(); });
  $('toggle').onclick = () => setSide(!side.classList.contains('open'));
  $('closeSide').onclick = () => { setSide(false); $('toggle').focus(); };

  const setHash = (id) => {
    try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); }
    catch { if (id) location.hash = id; }
  };

  let wall = null, paused = false;
  const reader = createReader({
    posts, mapAsset,
    onOpen: (p) => { browser.setCurrent(p.id); if (wall) { wall.focus(p); pager(); } if (location.hash.slice(1) !== p.id) setHash(p.id); paused = true; },
    onClose: () => { setHash(''); paused = false; },
  });
  const browser = createBrowser({
    posts, container: $('mount'),
    onSelect: (p) => { if (narrow.matches) setSide(false); reader.open(p); },
    onFilter: (list) => { if (wall) { wall.setPosts(list); pager(); } },
  });

  function openFromHash() {
    let id = location.hash.slice(1);
    try { id = decodeURIComponent(id); } catch { /* tal cual */ }
    if (!id) { if (reader.isOpen) reader.close(); return; }
    const p = posts.find((x) => x.id === id);
    if (p && reader.current !== p) reader.open(p);
  }
  addEventListener('hashchange', openFromHash);

  // ------------------------------------------------------------ escena
  let THREE = null;
  try {
    THREE = await import('three');
    renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    // sin WebGL: queda el índice y el lector, que hacen lo mismo
    document.body.classList.add('nogl');
    $('c').remove();
    side.inert = false;
    $('boot').classList.add('off');
    openFromHash();
    return;
  }
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js'),
  ]);
  let dpr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07050f);
  scene.fog = new THREE.FogExp2(0x07050f, 0.03);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 220);
  camera.position.set(0, 1.5, 0.35);
  camera.lookAt(0, 1.45, -3);
  const anim = [];

  // estrellas
  {
    const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    const tint = [new THREE.Color(0xd8ccff), new THREE.Color(0xffd9a0), new THREE.Color(0x9fe0ff)];
    for (let i = 0; i < n; i++) {
      const u = Math.random(), th = Math.random() * Math.PI * 2, r = 70 + Math.random() * 50, s = Math.sqrt(1 - u * u);
      pos.set([Math.cos(th) * s * r, u * r * 0.95 - 3, Math.sin(th) * s * r], i * 3);
      const c = tint[i % 7 === 0 ? 1 : i % 5 === 0 ? 2 : 0].clone().multiplyScalar(0.45 + Math.random() * 0.55);
      col.set([c.r, c.g, c.b], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, fog: false, transparent: true, opacity: 0.9, depthWrite: false }));
    scene.add(stars);
    if (!reduced) anim.push((t) => { stars.rotation.y = t * 0.004; });
  }

  // nebulosas suaves
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const g = cv.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, 'rgba(150,100,255,.55)'); gr.addColorStop(.45, 'rgba(90,50,170,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    for (const [x, y, z, s, c] of [[-34, 16, -60, 80, 0xffffff], [44, 24, -44, 56, 0xffc8a0], [10, 34, 56, 90, 0x9fd8ff], [-60, 20, 20, 70, 0xc8a8ff]]) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: c, transparent: true, opacity: 0.3, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
      sp.position.set(x, y, z); sp.scale.set(s, s * 0.6, 1); scene.add(sp);
    }
  }

  // cubierta: disco con anillos y rejilla tenue
  {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
    const g = cv.getContext('2d'), C = 512;
    const gr = g.createRadialGradient(C, C, 0, C, C, C);
    gr.addColorStop(0, '#1d1238'); gr.addColorStop(.62, '#120b24'); gr.addColorStop(.95, '#0b0718'); gr.addColorStop(1, 'rgba(7,5,15,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
    g.strokeStyle = 'rgba(181,155,255,.10)'; g.lineWidth = 2;
    for (let r = 60; r < 500; r += 56) { g.beginPath(); g.arc(C, C, r, 0, Math.PI * 2); g.stroke(); }
    for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; g.beginPath(); g.moveTo(C + Math.cos(a) * 60, C + Math.sin(a) * 60); g.lineTo(C + Math.cos(a) * 480, C + Math.sin(a) * 480); g.stroke(); }
    g.strokeStyle = 'rgba(255,194,122,.22)'; g.lineWidth = 3; g.beginPath(); g.arc(C, C, 52, 0, Math.PI * 2); g.stroke();
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const floor = new THREE.Mesh(new THREE.CircleGeometry(7.2, 96), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
  }

  // cúpula de observación: costillas finas desde el borde de la cubierta hasta lo alto
  {
    const mat = new THREE.MeshBasicMaterial({ color: 0x2a1d4f, transparent: true, opacity: 0.85 });
    const R = 7, Hh = 6.2, ribs = 14;
    for (let i = 0; i < ribs; i++) {
      const a = (i / ribs) * Math.PI * 2;
      const pts = [];
      for (let k = 0; k <= 24; k++) { const u = k / 24, ang = u * Math.PI / 2; pts.push(new THREE.Vector3(Math.cos(a) * R * Math.cos(ang), Hh * Math.sin(ang), Math.sin(a) * R * Math.cos(ang))); }
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.035, 6, false), mat));
    }
    const rim = new THREE.Mesh(new THREE.TorusGeometry(7, 0.06, 8, 180), new THREE.MeshBasicMaterial({ color: 0xb59bff, transparent: true, opacity: 0.35, toneMapped: false }));
    rim.rotation.x = Math.PI / 2; rim.position.y = 0.03; scene.add(rim);
    const top = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.05, 8, 64), mat);
    top.rotation.x = Math.PI / 2; top.position.y = Hh - 0.2; scene.add(top);
  }

  // polvo en suspensión
  const dust = (() => {
    const n = 240, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) pos.set([(Math.random() - .5) * 9, Math.random() * 3.4, (Math.random() - .5) * 9], i * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const p = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.018, color: 0xffd9a0, transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending }));
    scene.add(p); return p;
  })();

  // muro de holopaneles
  wall = createHoloWall(THREE, { posts: browser.filtered, mapAsset, reducedMotion: reduced });
  scene.add(wall.group);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.55, 0.64);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); composer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 68 : w / h < 1.2 ? 66 : 62;
    // en escritorio el índice ocupa la derecha: el centro óptico se desplaza a la zona libre
    const off = !narrow.matches ? 178 : 0;
    if (off) camera.setViewOffset(w + off * 2, h, off * 2, 0, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    renderOnce = true;
  }
  addEventListener('resize', resize);

  function pager() {
    $('pg').textContent = `${wall.page + 1} / ${wall.pages}`;
    $('prev').disabled = wall.page === 0;
    $('next').disabled = wall.page >= wall.pages - 1;
  }
  $('prev').onclick = () => { wall.prevPage(); pager(); };
  $('next').onclick = () => { wall.nextPage(); pager(); };

  // ------------------------------------------------------------ interacción
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const canvas = $('c');
  let down = null, lastX = 0, moved = 0, hinted = false;
  const unhint = () => { if (!hinted) { hinted = true; $('mhint').classList.add('off'); } };
  function pickAt(x, y) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return wall.pick(ray);
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (down !== null) return;
    down = e.pointerId; lastX = e.clientX; moved = 0;
    canvas.setPointerCapture(e.pointerId);
    wall.hold(true);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (down === e.pointerId) {
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      if (moved > 6) { canvas.classList.add('drag'); wall.spin(-dx * 0.0012 * (camera.fov / 62) * (1400 / Math.max(700, innerWidth))); unhint(); }
    } else if (e.pointerType === 'mouse') {
      const p = pickAt(e.clientX, e.clientY);
      wall.hover(p); canvas.classList.toggle('pt', !!p);
    }
  });
  const end = (e) => {
    if (down !== e.pointerId) return;
    down = null; canvas.classList.remove('drag');
    wall.hold(false);
    if (moved <= 6 && e.type === 'pointerup') {
      const p = pickAt(e.clientX, e.clientY);
      if (p) { unhint(); reader.open(p); }
    }
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && down === null) { wall.hover(null); canvas.classList.remove('pt'); } });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); wall.spin((Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * (e.deltaMode === 1 ? 16 : 1) * 0.00028); }, { passive: false });
  addEventListener('keydown', (e) => {
    if (reader.isOpen || e.altKey || e.ctrlKey || e.metaKey) return;
    const typing = e.target.closest && e.target.closest('input,textarea,select'), inSide = side.contains(e.target);
    if (e.key === 'ArrowLeft' && !typing) { e.preventDefault(); wall.step(-1); }
    else if (e.key === 'ArrowRight' && !typing) { e.preventDefault(); wall.step(1); }
    else if (e.key === 'PageDown' && !inSide) { e.preventDefault(); wall.nextPage(); pager(); }
    else if (e.key === 'PageUp' && !inSide) { e.preventDefault(); wall.prevPage(); pager(); }
    else if (e.key === '/' && !typing) { e.preventDefault(); setSide(true); browser.focusSearch(); }
    else if (e.key === 'Escape' && narrow.matches && side.classList.contains('open')) setSide(false);
  });

  // ------------------------------------------------------------ bucle (con calidad adaptable)
  const clock = new THREE.Clock();
  let t = 0, frames = 0, slowAcc = 0, degraded = 0;
  function degrade() {
    degraded++;
    if (degraded === 1) { dpr = Math.max(1, dpr * 0.75); renderer.setPixelRatio(dpr); composer.setPixelRatio(dpr); }
    else if (degraded === 2) { bloom.enabled = false; }
    else if (degraded === 3) { dpr = 1; renderer.setPixelRatio(1); composer.setPixelRatio(1); }
    resize();
  }
  resize();
  pager();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    // con el lector abierto la sala no se ve: se dibuja un último fotograma y se para
    if (paused && !renderOnce) return;
    t += dt;
    wall.update(t, dt);
    anim.forEach((f) => f(t));
    if (!reduced) { dust.rotation.y = t * 0.01; dust.position.y = Math.sin(t * 0.2) * 0.05; camera.position.y = 1.5 + Math.sin(t * 0.35) * 0.015; }
    composer.render();
    renderOnce = false;
    // si los primeros segundos van lentos, baja resolución y luego el brillo
    if (++frames > 30 && degraded < 3 && !paused) {
      slowAcc = slowAcc * 0.95 + (dt > 1 / 40 ? 1 : 0) * 0.05;
      if (slowAcc > 0.6) { slowAcc = 0; frames = 0; degrade(); }
    }
  });
  document.addEventListener('visibilitychange', () => { clock.getDelta(); });
  requestAnimationFrame(() => { $('boot').classList.add('off'); openFromHash(); });
}
</script>
