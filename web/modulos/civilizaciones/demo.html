<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civilizaciones visibles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
/* Lienzo a pantalla completa; ficha de la civilización a la izquierda (abajo en móvil); mandos arriba. */
:root{
  --void:#08061a;
  --hull:rgba(22,16,48,.74);
  --line:rgba(176,156,255,.22);
  --ink:#ece8ff;
  --muted:#a59cd3;
  --violet:#b69cff;
  --glow:#e4d6ff;
  --amber:#ffcf8a;
  --font-ui:"Chakra Petch",ui-monospace,"Segoe UI",system-ui,sans-serif;
  --font-lore:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--violet);font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.seed input{font:500 13px/1 var(--font-ui);color:var(--ink);background:var(--hull);border:1px solid var(--line);border-radius:4px;
  padding:9px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{cursor:pointer;letter-spacing:.06em}
button:hover{border-color:var(--violet)}
button:focus-visible,.seed input:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
button.primary{background:rgba(150,118,255,.28);border-color:rgba(182,156,255,.6);color:#fff}
button[aria-pressed="true"]{background:rgba(255,160,90,.22);border-color:rgba(255,190,130,.6);color:#fff}
.seed{display:flex}
.seed input{width:9em;border-radius:4px 0 0 4px;letter-spacing:.08em}
.seed button{border-radius:0 4px 4px 0;border-left:none}
.card{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:min(410px,calc(100% - 32px));overflow:auto;background:var(--hull);border:1px solid var(--line);
  border-radius:6px;padding:18px 20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:14px}
.desig{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.05;letter-spacing:.02em;color:var(--glow);text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--violet)}
.era{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:rgba(10,7,30,.45)}
.era-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.era-name{font-size:17px;font-weight:600;color:#fff}
.k{font-variant-numeric:tabular-nums;color:var(--amber);font-size:15px;letter-spacing:.06em;white-space:nowrap}
.era-sum{font-size:13px;color:var(--muted);line-height:1.4;min-height:2.8em}
input[type=range]{width:100%;accent-color:var(--violet);margin:6px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;min-width:0}
.lore{font-family:var(--font-lore);font-size:15.5px;line-height:1.55;color:#d9d3f5;margin:0}
dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0;padding-top:12px;border-top:1px solid var(--line)}
dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
dd{margin:2px 0 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-1px;margin-right:6px;box-shadow:0 0 8px currentColor}
.feats{display:flex;gap:5px;flex-wrap:wrap}
.feat{font-size:10.5px;letter-spacing:.06em;padding:3px 7px;border-radius:3px;border:1px solid rgba(176,156,255,.12);color:rgba(165,156,211,.45);transition:all .3s}
.feat.on{color:#fff;border-color:rgba(255,207,138,.55);background:rgba(255,207,138,.12)}
h2{margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.12em;color:var(--muted);z-index:2}
.err{position:fixed;inset:auto 16px 16px 16px;background:#3a1030;border:1px solid #ff7ab0;padding:10px;border-radius:4px;font-size:12px;z-index:9;white-space:pre-wrap}
@media (max-width:720px){
  .card{top:auto;max-height:46%;padding:14px;gap:10px}
  .lore{font-size:14.5px}
  .hint,.brand{display:none}
  .controls{width:100%}
  .seed{flex:1}.seed input{flex:1;width:auto;min-width:0}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Planeta con su civilización"></canvas>
<header class="top">
  <div class="brand"><b>La Malkevnia</b> · xenología orbital</div>
  <div class="controls">
    <button id="next" type="button" class="primary">Otro planeta</button>
    <button id="otherCiv" type="button" title="Otra civilización en este mismo planeta">Otra civilización</button>
    <form class="seed" id="seedForm">
      <label for="seedInput" hidden>Semilla</label>
      <input id="seedInput" autocomplete="off" spellcheck="false" placeholder="semilla">
      <button type="submit">Ir</button>
    </form>
  </div>
</header>

<aside class="card" aria-live="polite">
  <div class="desig"><span id="planetName">—</span><span id="origin">—</span></div>
  <h1 id="civName">—</h1>
  <div class="chips" id="chips"></div>

  <section class="era">
    <div class="era-top"><span class="era-name" id="eraName">—</span><span class="k" id="kval">K 0,00</span></div>
    <div class="era-sum" id="eraSum"></div>
    <label for="nivel" hidden>Nivel de civilización</label>
    <input id="nivel" type="range" min="0" max="3" step="0.01" value="1.6">
    <div class="ticks"><span>Nada</span><span>Tipo I</span><span>Tipo II</span><span>Tipo III</span></div>
  </section>

  <div class="row">
    <button id="play" type="button">▶ Evolución</button>
    <button id="ruins" type="button" aria-pressed="false">Ruinas</button>
    <button id="natural" type="button" title="El nivel que dicta la semilla">Nivel natural</button>
  </div>

  <p class="lore" id="lore"></p>

  <dl id="data"></dl>

  <div><h2>Qué se ve desde órbita</h2></div>
  <div class="feats" id="feats"></div>
</aside>
<div class="hint">Arrastra para girar · rueda para acercarte</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { generatePlanet, randomSeed, normalizeSeed } from '../planetas-procedurales/planetas.js';
import { createCivilization, civilizationSpec, FEATURES } from './civilizaciones.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
addEventListener('error', (e) => { const d = document.createElement('div'); d.className = 'err'; d.textContent = 'Error: ' + (e.message || e); document.body.append(d); });

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08061a);
const camera = new THREE.PerspectiveCamera(38, 1, 0.02, 600);
camera.position.set(1.6, 1.4, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.35; controls.maxDistance = 30;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate = !reduced; controls.autoRotateSpeed = 0.18;

// Fondo: estrellas y nebulosa
{
  const n = 5000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = 400, s = Math.sqrt(1 - u * u);
    pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
    const c = new THREE.Color().setHSL(0.62 + Math.random() * 0.2, 0.5, 0.6 + Math.random() * 0.4);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.2, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false })));
  const neb = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uA: { value: new THREE.Color(0x3a2470) }, uB: { value: new THREE.Color(0x0d2a4a) } },
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uA; uniform vec3 uB; varying vec3 vP;
      float h(vec3 p){return fract(sin(dot(p,vec3(12.9,78.2,37.7)))*43758.5);}
      float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
      void main(){ vec3 p=vP*2.5; float a=n3(p)*0.5+n3(p*2.1)*0.3+n3(p*4.3)*0.2;
        float b=n3(p*1.3+7.0); vec3 c=uA*smoothstep(0.45,0.85,a)*0.22+uB*smoothstep(0.5,0.9,b)*0.18;
        gl_FragColor=vec4(c,1.0);
        #include <colorspace_fragment>
      }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), neb));
}

// La estrella del sistema (para el enjambre de Dyson)
const STAR = { position: new THREE.Vector3(58, 16, -52), radius: 2.4 };
{
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uCol: { value: new THREE.Color(0xffe2b0) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(0.0,0.0,0.0,1.0); mv.xy+=position.xy*vec2(length(modelMatrix[0].xyz)); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uCol; varying vec2 vUv; void main(){ float d=length(vUv-0.5)*2.0;
      float core=smoothstep(0.1,0.0,d); float halo=pow(max(1.0-d,0.0),3.0)*0.9+pow(max(1.0-d,0.0),12.0)*1.5;
      gl_FragColor=vec4(uCol*(halo+core*2.0),1.0);
      #include <colorspace_fragment>
    }`,
  }));
  glow.position.copy(STAR.position); glow.scale.setScalar(STAR.radius * 9);
  glow.frustumCulled = false;
  scene.add(glow);
}

let planet = null, civ = null, planetSeed = 'hogar', civVariant = 0;
let nivel = 1.6, estado = 'viva', playing = false;

function civSeed() { return civVariant ? `${planetSeed}-c${civVariant}` : planetSeed; }

function build() {
  if (civ) civ.dispose();
  if (planet) planet.dispose();
  planet = generatePlanet(planetSeed, { detail: innerWidth < 720 ? 'media' : 'alta' });
  planet.setSunPosition(STAR.position);
  scene.add(planet.group);
  civ = createCivilization(civSeed(), planet.meta, { nivel, estado: estado, star: STAR, detalle: innerWidth < 720 ? 'media' : 'alta' });
  civ.attach(planet, { scene });
  civ.setResolution(renderer.getDrawingBufferSize(new THREE.Vector2()).y);
  renderStatic();
  renderLevel();
  try { history.replaceState(null, '', '#' + civSeed()); } catch {}
}

function renderStatic() {
  const m = civ.meta, p = planet.meta;
  $('planetName').textContent = `${p.nombre} · ${p.tipoNombre}`;
  $('origin').textContent = `Civilización ${m.origenNombre.toLowerCase()}`;
  $('civName').textContent = m.nombre;
  $('chips').innerHTML = [m.especie, m.especiePlural, `cultura ${m.cultura.nombre}`].map((c) => `<span class="chip">${esc(c)}</span>`).join('');
  $('seedInput').value = civSeed();
  document.title = `${m.nombre} · Civilizaciones visibles`;
}

function renderLevel() {
  const m = civ.meta;
  $('eraName').textContent = m.eraNombre;
  $('kval').textContent = m.kardashev;
  $('eraSum').textContent = estado === 'extinta' && nivel > 0.05 ? 'Extinta. Solo quedan ruinas, chatarra en órbita y estructuras vacías.' : m.eraResumen;
  $('nivel').value = nivel;
  $('nivel').setAttribute('aria-valuetext', `${m.kardashev}, ${m.eraNombre}`);
  $('lore').textContent = m.lore;
  const hex = '#' + new THREE.Color(m.paleta.luz).getHexString();
  const nat = m.existe ? `K ${m.nivelNatural.toLocaleString('es-ES', { minimumFractionDigits: 2 })}${m.extintaNatural ? ' · extinta' : ''}` : 'sin civilización';
  const rows = [
    ['Especie', `${m.especie}`], ['Población', m.poblacion],
    ['Energía', m.potencia], ['Luz de sus ciudades', `<span class="swatch" style="color:${hex};background:${hex}"></span>${esc(m.paleta.nombre)}`],
    ['Antigüedad', `${m.antiguedad.toLocaleString('es-ES')} ciclos`], ['Según la semilla', nat],
  ];
  $('data').innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${k === 'Luz de sus ciudades' ? v : esc(v)}</dd></div>`).join('');
  $('feats').innerHTML = FEATURES.map((f) => `<span class="feat${m.rasgos[f.id] > 0.05 ? ' on' : ''}">${esc(f.nombre)}</span>`).join('');
  $('ruins').setAttribute('aria-pressed', String(estado === 'extinta'));
}

function setNivel(n) { nivel = Math.max(0, Math.min(3, n)); civ.setNivel(nivel); renderLevel(); }

$('nivel').addEventListener('input', (e) => { playing = false; $('play').textContent = '▶ Evolución'; setNivel(+e.target.value); });
$('play').addEventListener('click', () => {
  playing = !playing;
  if (playing && nivel >= 2.99) setNivel(0);
  $('play').textContent = playing ? '❚❚ Pausa' : '▶ Evolución';
});
$('ruins').addEventListener('click', () => { estado = estado === 'extinta' ? 'viva' : 'extinta'; civ.setEstado(estado); renderLevel(); });
$('natural').addEventListener('click', () => {
  const m = civ.meta;
  estado = m.extintaNatural ? 'extinta' : 'viva';
  civ.setEstado(estado);
  setNivel(m.existe ? m.nivelNatural : 0);
});
$('next').addEventListener('click', () => { planetSeed = randomSeed(); civVariant = 0; build(); });
$('otherCiv').addEventListener('click', () => { civVariant++; build(); });
$('seedForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('seedInput').value.trim();
  const mm = v.match(/^(.*)-c(\d+)$/);
  planetSeed = normalizeSeed(mm ? mm[1] : v); civVariant = mm ? +mm[2] : 0; build();
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (w >= 720) camera.setViewOffset(w, h, -Math.min(230, w * 0.17), 0, w, h);
  else camera.setViewOffset(w, h, 0, h * 0.2, w, h);
  camera.updateProjectionMatrix();
  if (civ) civ.setResolution(renderer.getDrawingBufferSize(new THREE.Vector2()).y);
}
addEventListener('resize', resize);
resize();

{
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) { const mm = hash.match(/^(.*)-c(\d+)$/); planetSeed = normalizeSeed(mm ? mm[1] : hash); civVariant = mm ? +mm[2] : 0; }
}
build();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) {
    setNivel(nivel + dt * 0.11);
    if (nivel >= 3) { playing = false; $('play').textContent = '▶ Evolución'; }
  }
  controls.update();
  planet?.update(dt);
  civ?.update(dt);
  renderer.render(scene, camera);
});
window.__civ = () => civ;
window.__setNivel = setNivel;
window.__cam = camera;
window.__ctrl = controls;
</script>
</body>
</html>
