<title>Ordenador de a bordo</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
  :root { --bg:#07040f; --ink:#d2c0ff; --dim:#7e6bab; --bezel:#1a1229; --bezel2:#0f0a1a; --line:#2c2045; --chip:#150e24; --acc:#ff9be6; color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"VT323", ui-monospace, monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding-block:16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); gap:14px;
    background: radial-gradient(ellipse at 50% 30%, #1b0f36 0%, var(--bg) 60%); }
  .stars { position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image: radial-gradient(1px 1px at 12% 20%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 70%, #fff5 50%, transparent 51%), radial-gradient(1.5px 1.5px at 86% 64%, #e9d8ff9 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 88%, #fff4 50%, transparent 51%), radial-gradient(1px 1px at 60% 40%, #fff3 50%, transparent 51%); }
  .monitor { position:relative; width:min(980px, 100%); padding:clamp(10px, 2.2vw, 26px); border-radius:28px;
    background:linear-gradient(160deg, var(--bezel), var(--bezel2)); border:1px solid var(--line);
    box-shadow: 0 30px 80px -20px #000c, inset 0 1px 0 #ffffff10, 0 0 60px -10px #7a4dff33; }
  .screen { position:relative; height:min(66vh, 600px); min-height:340px; border-radius:18px; overflow:hidden; background:#0a0614;
    box-shadow: inset 0 0 40px #000, 0 0 0 2px #000; }
  .label { display:flex; gap:12px; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-top:10px; padding:0 6px; color:var(--dim); font-size:18px; letter-spacing:.08em; }
  .led { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6affc8; box-shadow:0 0 10px #6affc8; margin-right:8px; vertical-align:middle; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:min(980px,100%); }
  .chips button { font:inherit; font-size:19px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:3px 12px; cursor:pointer; }
  .chips button:hover, .chips button:focus-visible { border-color:var(--acc); color:var(--acc); outline:none; }

  .nav b, .nav a { color:var(--acc); font-weight:normal; }
</style>

<script type="module">
/*
 * Ordenador de a bordo · La Malkevnia
 * Terminal retro (CRT) dibujada entera en un <canvas> 2D, lista para usarse
 * como página normal o como textura de una pantalla dentro de la nave 3D.
 *
 *   import { init } from './ordenador-abordo.js';
 *   const term = init(contenedor, { data, onNavigate(id, sala) {} });
 *   ...
 *   term.dispose();
 *
 * Sin dependencias. Ver README.md para la API completa.
 */

const VERSION = '1.0.0';

/* ---------------------------------------------------------------- temas */

const THEMES = {
  purpura: { bg: '#0a0614', glow: '#2a1650', f: '#d2c0ff', d: '#7e6bab', a: '#ff9be6', w: '#ffc27a', o: '#6affc8', l: '#8fdcff', e: '#ff7f93' },
  ambar:   { bg: '#0c0702', glow: '#3a2206', f: '#ffc56e', d: '#9c753a', a: '#ffe3ad', w: '#ff9a3c', o: '#ffd98a', l: '#ffeabd', e: '#ff6a3c' },
  verde:   { bg: '#020a05', glow: '#063018', f: '#7dffa8', d: '#3d9a5d', a: '#caffdb', w: '#e6ff7a', o: '#7dffa8', l: '#a8ffe0', e: '#ff8a7a' },
  cian:    { bg: '#020a0e', glow: '#06283a', f: '#8ae8ff', d: '#4a8aa0', a: '#d4f7ff', w: '#ffd27a', o: '#7dffd0', l: '#c4edff', e: '#ff8a9a' },
};

/* ---------------------------------------------------------- datos base */

const DEFAULT_ROOMS = [
  { id: 'puente',     name: 'Puente de mando',      sub: 'Rumbo y navegación',      alias: ['mando', 'cabina', 'navegacion', 'timon'] },
  { id: 'pasillo',    name: 'Pasillo central',      sub: 'Cubierta principal',      alias: ['cubierta', 'pasillo'] },
  { id: 'recreativa', name: 'Sala recreativa',      sub: 'Videojuegos',             alias: ['videojuegos', 'arcade', 'consolas', 'recreativos'] },
  { id: 'proyeccion', name: 'Sala de proyección',   sub: 'Películas y series',      alias: ['cine', 'peliculas', 'pelis', 'series', 'filmoteca'] },
  { id: 'bitacora',   name: 'Bitácora',             sub: 'El diario de a bordo',    alias: ['blog', 'diario', 'posts'] },
  { id: 'juegos',     name: 'Sala de juegos',       sub: 'Juegos de mesa · Kallax', alias: ['mesa', 'kallax', 'ludoteca', 'tablero'] },
  { id: 'biblioteca', name: 'Biblioteca',           sub: 'Libros y manga',          alias: ['libros', 'manga', 'libreria', 'lectura'] },
  { id: 'ordenador',  name: 'Ordenador de a bordo', sub: 'Consola del capitán',     alias: ['consola', 'terminal', 'computadora'] },
  { id: 'maquinas',   name: 'Sala de máquinas',     sub: 'Reactor y soporte vital', alias: ['reactor', 'motores', 'ingenieria', 'motor'] },
];

const DEFAULT_PLANETS = [
  { id: 'thalassa',    name: 'Thalassa',    sub: 'Planeta océano, mareas lentas y faros' },
  { id: 'gelida',      name: 'Gélida',      sub: 'Hielo azul y auroras que cantan' },
  { id: 'izaro',       name: 'Izaro',       sub: 'Lejano. Dicen que allí el Cataclismo aún respira' },
  { id: 'brasa-menor', name: 'Brasa Menor', sub: 'Volcánico, cálido, cielos color ámbar' },
];

/* ---------------------------------------------------------- utilidades */

const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const clean = (s) => String(s ?? '').replace(/[{}]/g, '');
const pad = (s, n) => { s = String(s); const l = Array.from(s).length; return l >= n ? s : s + ' '.repeat(n - l); };
const padL = (s, n) => { s = String(s); const l = Array.from(s).length; return l >= n ? s : ' '.repeat(n - l) + s; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function lev(a, b) {
  const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}

/* Marcado de color: "{a}texto{/}" — f normal, d tenue, a acento, w aviso, o ok, l enlace, e error */
function parseMarkup(str) {
  const chars = []; let color = 'f';
  const re = /\{([fdawole])\}|\{\/\}/g; let last = 0, m;
  const push = (t) => { for (const ch of Array.from(t)) chars.push({ ch, c: color }); };
  while ((m = re.exec(str))) { push(str.slice(last, m.index)); color = m[1] || 'f'; last = re.lastIndex; }
  push(str.slice(last));
  return chars;
}

function stardate(d = new Date()) {
  const start = new Date(d.getFullYear(), 0, 1);
  const frac = (d - start) / (365.25 * 864e5);
  return (d.getFullYear() + frac).toFixed(3);
}

/* ================================================================ init */

function init(container, opts = {}) {
  const headless = !!opts.headless || !container;
  const data = opts.data || {};
  const rooms = (data.rooms || DEFAULT_ROOMS).map((r) => ({ ...r, _k: [r.id, r.name, r.sub, ...(r.alias || [])].map(norm) }));
  const planets = data.planets || DEFAULT_PLANETS;
  const games = (data.games || []).map((g) => ({ ...g, _k: norm(g.n) }));
  const posts = (data.posts || []).slice().sort((a, b) => (a.f < b.f ? -1 : 1)).map((p, i) => ({ ...p, id: i + 1, _t: norm(p.t), _r: norm(p.r) }));
  const baseUrl = opts.baseUrl ?? 'https://malkevnia.com';
  const captain = opts.captain || 'Malkev';
  const extra = opts.commands || {};

  /* ------------------------------------------------------------ estado */
  const st = {
    theme: THEMES[opts.theme] ? opts.theme : 'purpura',
    room: opts.room || 'ordenador',
    course: null,
    lastPost: null,
    lastList: [],
    coffee: 0.62,
    booted: Date.now(),
    input: '', caret: 0,
    history: [], hIdx: -1, hDraft: '',
    scroll: 0,
    focused: headless,
    disposed: false,
  };
  const buffer = [];   // líneas visibles: { chars, shown }
  const queue = [];    // pendientes: { chars } | { delay } | { fn }
  let typing = null;   // línea que se está escribiendo
  let waitUntil = 0;
  let speed = 1600;    // caracteres por segundo

  /* ------------------------------------------------------------ canvas */
  const canvas = opts.canvas || document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const text = document.createElement('canvas');   // capa de texto (se repinta solo si cambia)
  const tctx = text.getContext('2d');
  let fx = document.createElement('canvas');       // scanlines + viñeta (cacheado)
  let W = 0, H = 0, dpr = 1, fontPx = 16, charW = 9, lineH = 20, cols = 60, bodyRows = 20, padX = 16, headerH = 30;
  const fontFamily = opts.font || '"VT323", "IBM Plex Mono", "Cascadia Mono", Consolas, monospace';
  const effects = opts.effects !== false;
  let textDirty = true;

  let ta = null, ro = null;
  if (!headless) {
    if (getComputedStyle(container).position === 'static') container.style.position = 'relative';
    canvas.style.cssText = 'display:block;width:100%;height:100%;';
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Ordenador de a bordo de La Malkevnia: terminal de comandos');
    container.appendChild(canvas);
    ta = document.createElement('textarea');
    ta.setAttribute('aria-label', 'Escribe un comando');
    ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off');
    ta.setAttribute('autocorrect', 'off'); ta.setAttribute('spellcheck', 'false');
    ta.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:0;padding:0;margin:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;cursor:text;outline:none;';
    container.appendChild(ta);
    ta.addEventListener('input', onTaInput);
    ta.addEventListener('keydown', onTaKey);
    ta.addEventListener('focus', () => { st.focused = true; textDirty = true; });
    ta.addEventListener('blur', () => { st.focused = false; textDirty = true; });
    ta.addEventListener('wheel', onWheel, { passive: false });
    ro = new ResizeObserver(() => layout());
    ro.observe(container);
  }

  function layout(w, h) {
    if (headless) {
      dpr = 1; W = w || opts.width || W || 1024; H = h || opts.height || H || 640;
      fontPx = opts.fontSize || Math.round(H / 26);
    } else {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = container.getBoundingClientRect();
      const cw = Math.max(200, r.width), ch = Math.max(160, r.height);
      W = Math.round(cw * dpr); H = Math.round(ch * dpr);
      fontPx = Math.round((opts.fontSize || clamp(cw / 44, 15, 24)) * dpr);
    }
    canvas.width = text.width = W; canvas.height = text.height = H;
    tctx.font = `${fontPx}px ${fontFamily}`;
    charW = tctx.measureText('M').width || fontPx * 0.5;
    lineH = Math.round(fontPx * 1.12);
    padX = Math.round(charW * 1.6);
    headerH = Math.round(lineH * 1.7);
    cols = Math.max(20, Math.floor((W - padX * 2) / charW));
    bodyRows = Math.max(4, Math.floor((H - headerH - lineH * 2.2 - padX * 0.6) / lineH));
    for (const l of buffer) l.rows = null;
    buildFx();
    textDirty = true;
  }

  function buildFx() {
    fx.width = W; fx.height = H;
    const f = fx.getContext('2d');
    f.clearRect(0, 0, W, H);
    const step = Math.max(2, Math.round(dpr * 3));
    f.fillStyle = 'rgba(0,0,0,0.22)';
    for (let y = 0; y < H; y += step) f.fillRect(0, y, W, Math.max(1, Math.round(step / 3)));
    const g = f.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    f.fillStyle = g; f.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------ salida */
  function print(str = '') {
    for (const line of String(str).split('\n')) queue.push({ chars: parseMarkup(line) });
    st.scroll = 0;
  }
  const delay = (ms) => queue.push({ delay: ms });
  const later = (fn) => queue.push({ fn });

  function flush() {
    if (typing) { typing.shown = typing.chars.length; typing = null; }
    while (queue.length) {
      const it = queue.shift();
      if (it.chars) buffer.push({ chars: it.chars, shown: it.chars.length });
      else if (it.fn) it.fn();
    }
    waitUntil = 0; trim(); textDirty = true;
  }
  function trim() { if (buffer.length > 800) buffer.splice(0, buffer.length - 800); }

  function advance(dt, now) {
    if (now < waitUntil) return;
    let budget = Math.max(1, Math.round(dt * speed / 1000));
    while (budget > 0) {
      if (typing) {
        const take = Math.min(budget, typing.chars.length - typing.shown);
        typing.shown += take; budget -= take; textDirty = true;
        if (typing.shown >= typing.chars.length) typing = null; else break;
      }
      if (!queue.length) break;
      const it = queue.shift();
      if (it.delay) { waitUntil = now + it.delay; break; }
      if (it.fn) { it.fn(); continue; }
      const line = { chars: it.chars, shown: 0 };
      buffer.push(line); trim(); textDirty = true;
      if (!line.chars.length) { budget -= 1; continue; }
      typing = line;
    }
  }
  const busy = () => !!typing || queue.length > 0;

  /* ------------------------------------------------------------ pintado */
  function wrap(chars) {
    if (!chars.length) return [[]];
    const rows = []; let i = 0; const n = chars.length;
    while (i < n) {
      if (n - i <= cols) { rows.push(chars.slice(i)); break; }
      let j = -1;
      for (let k = i + cols; k > i; k--) if (chars[k] && chars[k].ch === ' ') { j = k; break; }
      if (j > i) { rows.push(chars.slice(i, j + 1)); i = j + 1; }
      else { rows.push(chars.slice(i, i + cols)); i += cols; }
    }
    return rows;
  }

  function drawChars(row, x0, y, limit = Infinity) {
    const T = THEMES[st.theme];
    let col = 0;
    for (const c of row) {
      if (col >= limit) break;
      if (c.ch !== ' ') { tctx.fillStyle = T[c.c] || T.f; tctx.fillText(c.ch, x0 + col * charW, y); }
      col++;
    }
  }

  function renderText() {
    const T = THEMES[st.theme];
    tctx.clearRect(0, 0, W, H);
    tctx.font = `${fontPx}px ${fontFamily}`;
    tctx.textBaseline = 'middle';

    // cabecera
    const room = rooms.find((r) => r.id === st.room);
    tctx.fillStyle = T.f; tctx.globalAlpha = 0.14; tctx.fillRect(padX * 0.5, padX * 0.5, W - padX, headerH - padX * 0.3); tctx.globalAlpha = 1;
    const hy = padX * 0.5 + (headerH - padX * 0.3) / 2;
    const now = new Date();
    const left = parseMarkup(`{a}◆{/} LA MALKEVNIA {d}·{/} ORDENADOR DE A BORDO`);
    const right = parseMarkup(`{d}${room ? room.name.toUpperCase() : ''}  ·  ${now.toTimeString().slice(0, 5)}  ·  FE ${stardate(now)}{/}`);
    const hc = cols;
    if (left.length + right.length + 2 <= hc) {
      drawChars(left, padX, hy);
      drawChars(right, padX + (hc - right.length) * charW, hy);
    } else drawChars(left.slice(0, hc), padX, hy);

    // cuerpo
    const all = [];
    for (const l of buffer) {
      if (!l.rows) l.rows = wrap(l.chars);
      let left = l.shown;
      for (const r of l.rows) { if (left <= 0 && l.shown < l.chars.length) break; all.push({ r, n: Math.min(r.length, Math.max(0, left)) }); left -= r.length; }
    }
    const maxScroll = Math.max(0, all.length - bodyRows);
    st.scroll = clamp(st.scroll, 0, maxScroll);
    const start = Math.max(0, all.length - bodyRows - st.scroll);
    const view = all.slice(start, start + bodyRows);
    const by = headerH + lineH * 0.9;
    view.forEach((v, i) => drawChars(v.r, padX, by + i * lineH, v.n));
    if (st.scroll > 0) {
      const tag = parseMarkup(`{w}▲ ${st.scroll} líneas más abajo · RePág/AvPág{/}`);
      drawChars(tag, padX + (cols - tag.length) * charW, by + (bodyRows - 1) * lineH);
    }

    // separador + línea de entrada
    const iy = H - lineH * 1.1 - padX * 0.3;
    tctx.fillStyle = T.d; tctx.globalAlpha = 0.5; tctx.fillRect(padX, iy - lineH * 0.85, W - padX * 2, Math.max(1, dpr)); tctx.globalAlpha = 1;
    const prompt = parseMarkup(`{a}${st.room}{/}{d} ▸ {/}`);
    const avail = cols - prompt.length - 1;
    const inp = Array.from(st.input);
    let off = 0; if (st.caret > avail) off = st.caret - avail;
    const vis = inp.slice(off, off + avail).map((ch) => ({ ch, c: 'f' }));
    drawChars(prompt, padX, iy);
    drawChars(vis, padX + prompt.length * charW, iy);
    curPos = { x: padX + (prompt.length + st.caret - off) * charW, y: iy };
    textDirty = false;
  }
  let curPos = { x: 0, y: 0 };

  let bgGrad = null, bgKey = '';
  function composite(now) {
    const T = THEMES[st.theme];
    if (bgKey !== st.theme + W + 'x' + H) {
      bgGrad = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
      bgGrad.addColorStop(0, T.glow); bgGrad.addColorStop(1, T.bg); bgKey = st.theme + W + 'x' + H;
    }
    ctx.globalAlpha = 1; ctx.filter = 'none';
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    if (effects && 'filter' in ctx) {
      ctx.filter = `blur(${Math.max(2, fontPx * 0.28)}px)`; ctx.globalAlpha = 0.75;
      ctx.drawImage(text, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
    }
    ctx.drawImage(text, 0, 0);
    // cursor
    const on = !busy() && (Math.floor(now / 530) % 2 === 0 || !st.focused);
    if (on) {
      ctx.fillStyle = T.a;
      if (st.focused) { ctx.globalAlpha = 0.75; ctx.fillRect(curPos.x, curPos.y - lineH * 0.42, charW, lineH * 0.84); }
      else { ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, dpr); ctx.strokeRect(curPos.x + 0.5, curPos.y - lineH * 0.42, charW - 1, lineH * 0.84); }
      ctx.globalAlpha = 1;
    }
    if (effects) {
      const band = H * 0.18, y = ((now * 0.04) % (H + band * 2)) - band;
      const g = ctx.createLinearGradient(0, y, 0, y + band);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.035)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, y, W, band);
      ctx.drawImage(fx, 0, 0);
      ctx.fillStyle = T.bg; ctx.globalAlpha = Math.random() * 0.035; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
    opts.onRender && opts.onRender(canvas);
  }

  let raf = 0, lastT = 0, lastDraw = 0, lastBlink = -1, lastMin = '';
  function frame(t) {
    if (st.disposed) return;
    raf = requestAnimationFrame(frame);
    const dt = lastT ? Math.min(100, t - lastT) : 16; lastT = t;
    advance(dt, t);
    const minute = new Date().toTimeString().slice(0, 5);
    if (minute !== lastMin) { lastMin = minute; textDirty = true; }
    const blink = Math.floor(t / 530);
    const fps = opts.fps || 30;
    const need = textDirty || blink !== lastBlink || (effects && t - lastDraw > 1000 / fps);
    if (!need) return;
    lastBlink = blink; lastDraw = t;
    if (textDirty) renderText();
    composite(t);
  }

  /* ------------------------------------------------------------ entrada */
  function setInput(v, caret = Array.from(v).length) {
    st.input = v.replace(/[\r\n]/g, ''); st.caret = clamp(caret, 0, Array.from(st.input).length);
    if (ta && ta.value !== st.input) { ta.value = st.input; }
    if (ta) { try { const u = Array.from(st.input).slice(0, st.caret).join('').length; ta.setSelectionRange(u, u); } catch (_) {} }
    textDirty = true;
  }
  function onTaInput() {
    if (/[\r\n]/.test(ta.value)) { ta.value = ta.value.replace(/[\r\n]/g, ''); }
    st.input = ta.value; st.caret = Array.from(ta.value.slice(0, ta.selectionStart)).length; textDirty = true;
  }
  function onTaKey(e) {
    if (special(e)) { e.preventDefault(); return; }
    setTimeout(() => { if (!ta) return; st.caret = Array.from(ta.value.slice(0, ta.selectionStart)).length; textDirty = true; }, 0);
  }
  function onWheel(e) { e.preventDefault(); st.scroll += e.deltaY < 0 ? 3 : -3; if (st.scroll < 0) st.scroll = 0; textDirty = true; }

  function special(e) {
    const k = e.key;
    if (e.ctrlKey && (k === 'l' || k === 'L')) { clear(); return true; }
    if (e.ctrlKey && (k === 'c' || k === 'C') && !(ta && ta.selectionStart !== ta.selectionEnd)) { if (busy()) flush(); print(`{d}${st.room} ▸ ${clean(st.input)}^C{/}`); setInput(''); return true; }
    switch (k) {
      case 'Enter': submit(); return true;
      case 'Tab': complete(); return true;
      case 'ArrowUp': histMove(1); return true;
      case 'ArrowDown': histMove(-1); return true;
      case 'PageUp': st.scroll += Math.max(1, bodyRows - 2); textDirty = true; return true;
      case 'PageDown': st.scroll = Math.max(0, st.scroll - Math.max(1, bodyRows - 2)); textDirty = true; return true;
      case 'Escape': if (busy()) flush(); else setInput(''); return true;
    }
    return false;
  }

  // Para modo headless (textura en la nave): el host reenvía los KeyboardEvent.
  function key(e) {
    if (special(e)) return true;
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    const a = Array.from(st.input);
    switch (e.key) {
      case 'Backspace': if (st.caret > 0) { a.splice(st.caret - 1, 1); setInput(a.join(''), st.caret - 1); } return true;
      case 'Delete': a.splice(st.caret, 1); setInput(a.join(''), st.caret); return true;
      case 'ArrowLeft': setInput(st.input, st.caret - 1); return true;
      case 'ArrowRight': setInput(st.input, st.caret + 1); return true;
      case 'Home': setInput(st.input, 0); return true;
      case 'End': setInput(st.input); return true;
    }
    if (e.key && Array.from(e.key).length === 1) { a.splice(st.caret, 0, e.key); setInput(a.join(''), st.caret + 1); return true; }
    return false;
  }
  function type(str) { const a = Array.from(st.input); a.splice(st.caret, 0, ...Array.from(str)); setInput(a.join(''), st.caret + Array.from(str).length); }

  function histMove(dir) {
    if (!st.history.length) return;
    if (st.hIdx === -1) st.hDraft = st.input;
    st.hIdx = clamp(st.hIdx + dir, -1, st.history.length - 1);
    setInput(st.hIdx === -1 ? st.hDraft : st.history[st.history.length - 1 - st.hIdx]);
  }

  function submit() {
    if (busy()) flush();
    const line = st.input;
    setInput(''); st.hIdx = -1;
    print(`{a}${st.room}{/}{d} ▸{/} ${clean(line)}`);
    if (line.trim()) { if (st.history[st.history.length - 1] !== line) st.history.push(line); if (st.history.length > 100) st.history.shift(); }
    run(line);
  }

  /* ------------------------------------------------------------ comandos */
  const C = {}; // nombre → { group, usage, help, run, hidden }
  const ALIAS = {};
  function def(names, spec) { const [main, ...al] = names; C[main] = spec; spec.name = main; for (const a of al) ALIAS[norm(a)] = main; }

  function findRoom(q) {
    const n = norm(q); if (!n) return null;
    return rooms.find((r) => r.id === n) || rooms.find((r) => r._k.includes(n)) ||
      rooms.find((r) => r._k.some((k) => k.split(/\W+/).includes(n))) || rooms.find((r) => r._k.some((k) => k.includes(n)));
  }
  function findPlanet(q) { const n = norm(q); return planets.find((p) => norm(p.id) === n || norm(p.name) === n) || planets.find((p) => norm(p.name).includes(n)); }

  function searchGames(q) {
    const toks = norm(q).split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    return games.filter((g) => toks.every((t) => g._k.includes(t)))
      .sort((a, b) => a._k.indexOf(toks[0]) - b._k.indexOf(toks[0]) || a.n.length - b.n.length);
  }
  function searchPosts(q) {
    const toks = norm(q).split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    return posts.map((p) => {
      let s = 0; for (const t of toks) { if (p._t.includes(t)) s += 3; else if (p._r.includes(t)) s += 1; else return null; }
      return { p, s };
    }).filter(Boolean).sort((a, b) => b.s - a.s || (a.p.f < b.p.f ? 1 : -1)).map((x) => x.p);
  }

  const gameLine = (g) => `  {a}${clean(g.n)}{/} {d}— ${clean(g.d || '')}${g.j ? ` · pegatina ${g.j}` : ''}${g.p ? ` · pósit «${clean(g.p)}»` : ''}{/}`;
  const postLine = (p) => `  {w}#${padL(p.id, 3)}{/} {d}${p.f}{/}  ${clean(p.t)}`;

  def(['ayuda', 'help', '?', 'comandos', 'h'], {
    group: 'Terminal', usage: 'ayuda [comando]', help: 'Muestra esta ayuda o la de un comando.',
    run(args) {
      if (args[0]) {
        const c = C[resolve(args[0])];
        if (!c || c.hidden) return print(`{e}No conozco «${clean(args[0])}».{/}`);
        print(`{a}${c.usage}{/}`); print(`  ${c.help}`);
        const al = Object.entries(ALIAS).filter(([, v]) => v === c.name).map(([k]) => k);
        if (al.length) print(`  {d}También: ${al.join(', ')}{/}`);
        if (c.more) for (const m of c.more) print(`  {d}${m}{/}`);
        return;
      }
      print('{a}ORDENADOR DE A BORDO{/} {d}· comandos disponibles{/}');
      const groups = {};
      for (const c of Object.values(C)) if (!c.hidden) (groups[c.group] ||= []).push(c);
      const w = Math.min(26, Math.max(...Object.values(C).filter((c) => !c.hidden).map((c) => c.usage.length)) + 2);
      for (const [g, list] of Object.entries(groups)) {
        print(''); print(`{w}${g.toUpperCase()}{/}`);
        for (const c of list) print(`  {o}${pad(c.usage, w)}{/}${c.help}`);
      }
      print('');
      print('{d}Tab completa · ↑↓ historial · RePág/AvPág desplaza · Esc borra · Ctrl+L limpia{/}');
      print('{d}Hay órdenes que no salen en esta lista. El ordenador guarda secretos.{/}');
    },
  });

  def(['ir', 'entrar', 'tp', 'teletransporte', 'vamos', 'cd'], {
    group: 'Navegación', usage: 'ir <sala>', help: 'Te lleva a una sala de la nave.',
    more: ['Vale el nombre o un apodo: cine, kallax, blog, libros, reactor…'],

      if (r.id === st.room) return print(`{d}Ya estás en ${r.name}.{/}`);
      print(`{d}Fijando destino:{/} {a}${r.name}{/}`);
      const s = speed; speed = 260;
      print('{d}Abriendo compuertas{/} {o}▓▓▓▓▓▓▓▓▓▓▓▓{/} {d}ok{/}');
      later(() => { speed = s; st.room = r.id; textDirty = true; });
      print(`{o}Has llegado a ${r.name}.{/} {d}${r.sub}.{/}`);

  def(['donde', 'dónde', 'ubicacion', 'localizar'], {
    group: 'Navegación', usage: 'dónde [juego]', help: 'Dónde estás tú, o en qué cubo de la Kallax está un juego.',
    run(args) {

  def(['buscar', 'busca', 'search', 'grep', 'find'], {
    group: 'Colección', usage: 'buscar <texto>', help: 'Busca en juegos, bitácora y salas a la vez.',

  def(['juegos', 'kallax', 'ludoteca', 'games'], {
    group: 'Colección', usage: 'juegos [texto]', help: 'Resumen de las Kallax, o lista de juegos que coinciden.',
    run(args) {
      if (!games.length) return print('{d}El inventario de la Kallax no está cargado.{/}');
      if (args.length) {
        const res = searchGames(args.join(' '));
        if (!res.length) return print(`{e}Ningún juego coincide con «${clean(args.join(' '))}».{/}`);
        print(`{w}${res.length} resultado${res.length > 1 ? 's' : ''}{/}`); for (const g of res.slice(0, 40)) print(gameLine(g));
        if (res.length > 40) print(`{d}  …y ${res.length - 40} más. Afina la búsqueda.{/}`);
        return;
      }
      const by = {}; for (const g of games) { const k = (g.d || '').split(' · ')[0] || 'Sin sitio'; by[k] = (by[k] || 0) + 1; }
      print(`{a}LUDOTECA DE A BORDO{/} {d}· ${games.length} cajas y libros catalogados{/}`);
      const max = Math.max(...Object.values(by));
      for (const [k, n] of Object.entries(by)) print(`  ${pad(k, 10)} {o}${'█'.repeat(Math.max(1, Math.round(n / max * 24)))}{/} ${n}`);

  def(['sugerir', 'sugiere', 'azar', 'random', 'jugar', 'quejuego'], {
    group: 'Colección', usage: 'sugerir [jugadores]', help: 'Elige un juego al azar (filtra por la pegatina de color).',
    run(args) {
      if (!games.length) return print('{d}El inventario de la Kallax no está cargado.{/}');
      let pool = games.filter((g) => !/^(vampiro|hombre lobo|mago|momia|wraith|anima|aquelarre|degenesis|d&d|dungeons)/i.test(g.n));
      const n = parseInt(args[0], 10);
      if (n) {
        const f = pool.filter((g) => g.j && g.j.split(/[\/-]/).map(Number).some((x, i, a) => x === n || (a.length === 2 && g.j.includes('-') && n >= a[0] && n <= a[1])));
        if (f.length) pool = f; else print(`{d}Ninguna pegatina dice ${n}; elijo de toda la Kallax.{/}`);
      }
      const g = pick(pool);
      print(`{d}Consultando al oráculo de la ludoteca…{/}`);
      print(`{o}Esta noche toca:{/} {a}${clean(g.n)}{/}`);
      print(`  {d}${clean(g.d)}${g.p ? ` · pósit «${clean(g.p)}»` : ''}{/}`);
    },
  });

  def(['bitacora', 'bitácora', 'blog', 'diario', 'posts'], {
    group: 'Bitácora', usage: 'bitácora [página|texto]', help: 'Últimas entradas del diario de a bordo.',
    run(args) {
      if (!posts.length) return print('{d}La bitácora está vacía.{/}');
      const page = parseInt(args[0], 10);
      let list, title;
      if (args.length && !page) { list = searchPosts(args.join(' ')); title = `${list.length} entradas con «${clean(args.join(' '))}»`; }
      else {
        const per = Math.max(5, bodyRows - 6), p = Math.max(1, page || 1);
        const desc = posts.slice().reverse();
        list = desc.slice((p - 1) * per, p * per);
        title = `BITÁCORA · página ${p} de ${Math.ceil(desc.length / per)} · ${posts.length} entradas`;
      }
      print(`{a}${title}{/}`);
      for (const x of list.slice(0, 30)) print(postLine(x));
      if (list.length > 30) print(`{d}  …y ${list.length - 30} más.{/}`);
      print('{d}«leer <número>» abre una entrada · «bitácora 2» pasa página{/}');
      st.lastList = list;
    },
  });

  def(['leer', 'lee', 'cat', 'ver'], {
    group: 'Bitácora', usage: 'leer <número|texto>', help: 'Lee una entrada de la bitácora.',
    run(args) {
      if (!posts.length) return print('{d}La bitácora está vacía.{/}');
      let p;
      if (!args.length) p = posts[posts.length - 1];
      else if (/^#?\d+$/.test(args[0])) p = posts.find((x) => x.id === parseInt(args[0].replace('#', ''), 10));
      else if (/^(ultima|ultimo|última|último)$/.test(norm(args[0]))) p = posts[posts.length - 1];
      else p = searchPosts(args.join(' '))[0];
      if (!p) return print(`{e}No encuentro esa entrada.{/} {d}Prueba «bitácora».{/}`);
      st.lastPost = p;
      print(`{w}#${p.id} · ${p.f}{/}${p.g && p.g.length ? `{d} · ${p.g.map(clean).join(', ')}{/}` : ''}`);
      print(`{a}${clean(p.t).toUpperCase()}{/}`);
      print('');
      print(clean(p.r));
      print('');
      print(`{l}${baseUrl}${p.u}{/}`);
      print('{d}«abrir» la lleva a la pantalla grande · «leer ' + (p.id > 1 ? p.id - 1 : 1) + '» la anterior{/}');
    },
  });

  egg(['gato', 'miau', 'cat?', 'michi'], () => { print('{a} /\\_/\\\n( o.o )\n > ^ <{/}'); print('{d}El gato de a bordo duerme sobre la consola del reactor. No le despiertes.{/}'); });

    print(`Lo siento, ${captain}. Me temo que no puedo hacer eso.`); print('{d}…Es broma. Las compuertas de esta nave nunca se cierran para ti.{/}');
  });
  egg(['autodestruccion', 'autodestrucción', 'autodestruct', 'destruir'], () => {
    print('{e}SECUENCIA DE AUTODESTRUCCIÓN INICIADA{/}');
    for (let i = 5; i >= 1; i--) { print(`{e}  ${i}…{/}`); delay(650); }
    print('{w}  …{/}'); delay(900);
    print('{o}Autodestrucción cancelada.{/} {d}El capitán aún no ha terminado de ordenar la Kallax.{/}');
  });
  egg(['matrix', 'neo'], () => { for (let i = 0; i < 6; i++) print('{o}' + Array.from({ length: Math.min(cols, 48) }, () => pick('ｱｲｳｴｵｶｷｸｹｺ01ﾘﾙﾚﾛ ')).join('') + '{/}'); print('{d}Despierta, capitán… No, espera, que esto es otra nave.{/}'); });
  egg(['te quiero', 'gracias', 'thanks'], () => print('{a}♥{/} {d}De nada, capitán. Para eso estoy.{/}'));
  egg(['dormir', 'sleep', 'siesta'], () => { print('{d}Bajando las luces del puente…{/}'); delay(1200); print('{d}z z z{/}'); delay(1200); print('Ya. Ha sido una siesta corta, pero reparadora.'); });

  function resolve(name) { const n = norm(name); return C[n] ? n : ALIAS[n] || (C[name] ? name : null); }

  function run(line) {
    const raw = line.trim();
    if (!raw) return;
    const nr = norm(raw);
    // frases enteras
    if (/^(abre|abrir) (las )?(compuertas|puertas)/.test(nr)) return C.abre.run([]);
    if (/^(sentido de la vida|la respuesta)/.test(nr)) return C['42'].run([]);
    if (/^(te quiero|muchas gracias|gracias)/.test(nr)) return C['te quiero'].run([]);
    if (/^(donde estoy|donde me encuentro)$/.test(nr)) return C.donde.run([]);
    if (/^(que|qué) (juego|jugamos)/.test(nr)) return C.sugerir.run([]);
    const [head, ...args] = raw.split(/\s+/);
    const rest = raw.slice(head.length).trim();
    const custom = Object.keys(extra).find((k) => norm(k) === norm(head));
    if (custom) { try { extra[custom].run(args, { print, raw: rest, state: st, navigate: (id) => run('ir ' + id) }); } catch (e) { print(`{e}${clean(e.message)}{/}`); } return; }
    const name = resolve(head);
    if (name) {
      try { C[name].run(args, rest); } catch (e) { print(`{e}Fallo del sistema: ${clean(e.message)}{/}`); }
      opts.onCommand && opts.onCommand(name, args);
      return;
    }
    // ¿es una sala? "cine" → ir cine
    const r = findRoom(raw);
    if (r && norm(raw).length >= 3) return C.ir.run([raw]);
    const all = [...Object.keys(C).filter((k) => !C[k].hidden), ...Object.keys(ALIAS).filter((a) => !C[ALIAS[a]].hidden)];
    let best = null, bd = 9; for (const c of all) { const d = lev(norm(head), c); if (d < bd) { bd = d; best = c; } }
    print(`{e}Orden no reconocida: «${clean(head)}».{/}${best && bd <= 2 ? ` {d}¿Querías decir{/} {o}${best}{/}{d}?{/}` : ' {d}Escribe «ayuda».{/}'}`);
  }

  function complete() {
    const v = st.input; const parts = v.split(/\s+/);
    let opts2 = [], prefix = '';
    if (parts.length <= 1) {
      opts2 = [...Object.keys(C).filter((k) => !C[k].hidden), ...Object.keys(extra)]; prefix = '';
    } else {
      const cmd = resolve(parts[0]); prefix = parts.slice(0, -1).join(' ') + ' ';
      if (cmd === 'ir') opts2 = rooms.map((r) => r.id);
      else if (cmd === 'rumbo') opts2 = planets.map((p) => p.id);
      else if (cmd === 'tema') opts2 = Object.keys(THEMES);
      else if (cmd === 'ayuda') opts2 = Object.keys(C).filter((k) => !C[k].hidden);
      else if (cmd === 'donde' || cmd === 'juegos') opts2 = games.map((g) => g.n);
    }
    const m = opts2.filter((o) => norm(o).startsWith(norm(parts.length <= 1 ? v : parts[parts.length - 1])));
    if (!m.length) return;
    if (m.length === 1) return setInput(prefix + m[0] + (prefix ? '' : ' '));
    let common = m[0];
    for (const x of m) { let i = 0; while (i < common.length && i < x.length && norm(common[i]) === norm(x[i])) i++; common = common.slice(0, i); }
    if (common.length > (parts.length <= 1 ? v : parts[parts.length - 1]).length) setInput(prefix + common);
    else { print(`{a}${st.room}{/}{d} ▸{/} ${clean(v)}`); print('{d}' + m.slice(0, 24).join('   ') + (m.length > 24 ? '   …' : '') + '{/}'); }
  }

  function clear() { flush(); buffer.length = 0; st.scroll = 0; textDirty = true; }

  function boot() {
    const s = speed; speed = 900;
    print('{d}MALK-OS ' + VERSION + ' · secuencia de arranque{/}');
    print('{d}Comprobando memoria de núcleo……………{/} {o}OK{/}'); delay(120);
    print('{d}Sincronizando reactor de éter………………{/} {o}OK{/}'); delay(120);
    print(`{d}Indexando bitácora……………………………………{/} {o}${posts.length} entradas{/}`); delay(100);
    print(`{d}Inventariando Kallax…………………………………{/} {o}${games.length} cajas{/}`); delay(100);
    print(`{d}Cartografía de la nave………………………………{/} {o}${rooms.length} salas{/}`); delay(220);
    later(() => { speed = s; });
    print('');
    print('{a}  ╔╦╗╔═╗╦  ╦╔═  ╔═╗╔═╗{/}');
    print('{a}  ║║║╠═╣║  ╠╩╗  ║ ║╚═╗{/}');
    print('{a}  ╩ ╩╩ ╩╩═╝╩ ╩  ╚═╝╚═╝{/}');
    print('');
    print(`Bienvenido a bordo, capitán {a}${captain}{/}. Todos los sistemas en calma.`);
    print('{d}Escribe{/} {o}ayuda{/} {d}para ver las órdenes, o prueba{/} {o}estado{/}{d},{/} {o}buscar zelda{/} {d}o{/} {o}ir cine{/}{d}.{/}');
    print('');
  }

  /* ------------------------------------------------------------ arranque */
  layout();
  if (!headless && document.fonts && document.fonts.load) {
    document.fonts.load(`${fontPx}px ${fontFamily}`).then(() => !st.disposed && layout()).catch(() => {});
  }
  if (opts.boot !== false) boot(); else print('{d}Ordenador de a bordo listo. Escribe «ayuda».{/}');
  raf = requestAnimationFrame(frame);
  if (!headless && opts.autofocus !== false) setTimeout(() => ta && ta.focus({ preventScroll: true }), 50);

  /* ------------------------------------------------------------ API */
  return {
    canvas,
    version: VERSION,
    exec(cmd) { if (busy()) flush(); print(`{a}${st.room}{/}{d} ▸{/} ${clean(cmd)}`); run(cmd); },
    print(str) { print(String(str)); },
    key, type,
    focus() { st.focused = true; textDirty = true; if (ta) ta.focus({ preventScroll: true }); },
    blur() { st.focused = false; textDirty = true; if (ta) ta.blur(); },
    resize(w, h) { layout(w, h); },
    setRoom(id) { if (rooms.some((r) => r.id === id)) { st.room = id; textDirty = true; } },
    setTheme(t) { if (THEMES[t]) { st.theme = t; bgKey = ''; textDirty = true; } },
    get room() { return st.room; },
    get theme() { return st.theme; },
    dispose() {
      st.disposed = true; cancelAnimationFrame(raf);
      if (ro) ro.disconnect();
      if (ta) { ta.removeEventListener('input', onTaInput); ta.removeEventListener('keydown', onTaKey); ta.remove(); }
      if (!headless && canvas.parentNode === container) canvas.remove();
    },
  };
}

const posts = [{"f": "2010-02-28", "t": "Empecemos con mal pie...", "u": "/blog/2010/02/28/donde-lo-habiamos-dejado/", "r": "Empecemos... Llegas a casa del trabajo y tu mundo esta en ruinas, te encuentras que ya \"no estas en una relación\" en Facebook, el amor de tu vida ha cambiado su subnik moñas y no tienes nada que hacer esa tarde porque has pasado los últimos años de tu existencia dedicándole toda tu alma al puro y sincero amor, tus amigos no se acuerdan de ti, no tienes mascota, y en breve, estarás en el paro. Te preguntas: \"Y ahora que?\" Ahora nada, ahora no hay nada, ni tan solo un tu…", "g": ["archivo", "diario", "relaciones", "música"]}, {"f": "2010-03-03", "t": "Mi corazón en un vídeo", "u": "/blog/2010/03/03/mi-corazon-en-un-video/", "r": "No tuve tiempo de comprarle 17 rosas como hacia todos los meses, así que decidí grabarle un vídeo como regalo por nuestros 11 meses... pero todo termino antes de que pudiera entregarlo. A veces pienso que tal vez hubiera cambiado algo las cosas si hubiera sido mas rapido... Ya nunca lo sabre... Llegué dos días tarde. Si hubiera sido mas maduro en ese momento, el vídeo no hubiera salido de mi PC y solo lo hubiera sufrido yo, pero no fue así. Probablemente le hice pasar un mal…", "g": ["archivo", "diario", "relaciones"]}, {"f": "2010-03-05", "t": "Despiertame cada día", "u": "/blog/2010/03/05/antiguos-textos/", "r": "Y sin que ella se diera cuenta, me deslizo lenta y sigilosamente a través de las pesadas mantas, me apoyo ligeramente en el colchón, pego una patada a la puerta de mi memoria con tanta fuerza como mis piernas me lo permiten, entro como una bestia en la atestada habitación, arrollando recuerdos estúpidos hacia los lados y haciendo todo el espacio posible para lo que en breve voy a dejar grabado en el mas duro metal que mi mente pueda imaginar. Una vez completados los…", "g": ["archivo", "relatos", "música"]}, {"f": "2010-03-05", "t": "Perra vida", "u": "/blog/2010/03/05/perra-vida/", "r": "De nuevo se avecina la soledad, tan gradual y sosegada como de costumbre, acercándose y abrazándome como suele ocurrir en estos largos días sin sentido... Como un atribulado chucho cuando su dueño le abandona. Siempre fiel a su amo, pero deseoso de que fuera tan dependiente o incluso mas que el, como esas viudas locas cuya única razón de ser es su querida, amada y venerada mascota. De nuevo me canso de rascar esa maldita puerta que no se abre y me revela esa silueta. Ni el…", "g": ["archivo", "diario"]}, {"f": "2010-03-15", "t": "Reencuentro... inesperado", "u": "/blog/2010/03/15/reencuentro-con-helena/", "r": "Como todo adolescente que pretende hacerse pasar por adulto sabe, cuando se termina una relación, se debe pasar a la fase amigo de nuevo, porque al fin y al cabo, somos personas maduras, capaces de afrontar este tipo de situaciones, e incluso, muchas peores. Probablemente no haya cosa mas ingenua en este mundo que creer que eso pueda ser cierto, y si existe una mínima posibilidad de que eso suceda, debe ser desde una distancia de seguridad de no menos de cincuenta…", "g": ["archivo", "diario", "relaciones"]}, {"f": "2010-04-13", "t": "Cover de Bob Esponja", "u": "/blog/2010/04/13/documentos-rescatados-del-pasado-cover-bob-esponja/", "r": "En mi primer intento de blog, incitaba a la gente para que retara a hacer cosas. Denai, uno de los lectores, me propuso que cantara la canción de Bob Esponja, me motivé un poco mas de la cuenta y este es el cutre resultado.", "g": ["archivo", "retos", "música", "humor"]}, {"f": "2010-04-23", "t": "Mi primera borrachera", "u": "/blog/2010/04/23/primera-borrachera/", "r": "El Vídeo de de calidad ultramierdosa gracias a la colaboración de Berto, que manipuló la camara previo inicio de la grabación. Por supuesto, sin ninguna edición, los fragmentos están tal cual fueron grabados. Ver solo en caso de aburrimiento extremo. Estáis avisados, pues ni yo mismo lo he visto. Subido a megavideo por motivos de tamaño y duración. (eso dijo ella xD)", "g": ["archivo", "diario", "humor"]}, {"f": "2010-07-27", "t": "Todo sobre Alasblancas", "u": "/blog/2010/07/27/todo-sobre-alasblancas/", "r": "Se me dan fatal las fechas, lo he comprobado y efectivamente, no llevaba dos, sino cuatro meses soltero. PD: Si quieres saber mas sobre Helena, pulsa aquí.", "g": ["archivo", "meta"]}, {"f": "2010-07-28", "t": "Ficción: Una relación de seis días", "u": "/blog/2010/07/28/ficcion-total-y-absoluta/", "r": "Ante todo, hay que tomarselo con humor. Personajes involucrados, hechos y cualquier cosa escrita, no tienen nada que ver con la realidad y si se asemeja, es pura coincidencia. Avisados quedáis. DÍA 1 Era un bonito día de verano, me encontraba yo, a las nueve y media de la mañana, tan fresco como puedo estar a esas horas, teniendo en cuenta que no había dormido en toda la noche, ya que las pasaba con mis proyectos pendientes y la silenciosa compañía de la mortecina soledad.…", "g": ["archivo", "relatos", "humor"]}, {"f": "2010-09-19", "t": "La venganza de la vampiresa", "u": "/blog/2010/09/19/la-venganza-de-la-vampiresa/", "r": "Habia pasado un año y medio desde que termino nuestra relación, y unos ocho meses desde que nos vimos por ultima vez. Lo que paso ese día... aun escapa a mi razón. Pero como siempre intento con las historias mas bizarras, lo tomare con humor. La historia en realidad, no puede dar mucho de si, ya que aconteció en unos pocos minutos, pero añadiré mi punto de vista respecto al tema para matizarlo un poquito. Sábado, dormir durante 12 horas después de lo que parecía el final de…", "g": ["archivo", "diario", "humor"]}, {"f": "2010-10-14", "t": "La pelirroja", "u": "/blog/2010/10/14/la-pelirroja/", "r": "| --- | | (13:33)...\" tags: [archivo, diario, relaciones] published: false redirectfrom: - /?p=1122/ --- Creo que esta conversación final con la pelirroja da a entender toda nuestra historia. Que cada uno saque su propio mensaje. | | | | --- | --- | | (13:33) Malkev: | Hola | | (13:33) Pelirroja: | buenas | | ( rsación es entre mi amigo…", "g": ["archivo", "humor"]}, {"f": "2010-11-22", "t": "Salir, beber, el rollo de siempre", "u": "/blog/2010/11/22/desconexion/", "r": "Me despierta el despertador (redundancia cero, oiga), sonando por vigésimo segunda vez, hoy tampoco me he levantado temprano como tenia pensado. Sin salir de la cama, hecho una partida al juego arcade de turno en el Iphone, mi nuevo ritual de la \"mañana\". Mi cuerpo es expulsado de la cama, aunque mi mente todavía se encuentra en algún lugar del mundo inmaterial. Debería peinarme y arreglarme un poco, pero toca ir a buscar a Z.Z. y me conoce mejor desaliñado, asi que voy a ir…", "g": ["archivo", "diario"]}, {"f": "2010-11-24", "t": "¿Cuanto queda de mi?", "u": "/blog/2010/11/24/cuanto-yo-queda-en-mi/", "r": "¿Cómo decir en un instante todo lo que significas? ¿Cómo resumir en uns líneas todo lo que provocas? ¿Cómo expresar con naturalidad lo que representa una sonrisa en esos ojos verdes? ¿Una mirada acusadora o una \"sugerencia\"? ¿Cómo descubrirle al mundo, y a tí mismo, todo lo que reside dentro de esa cabecita? Todos los proyectos, los sueños, las obsesiones compartidas, el afán, el afán de perseguir lo que quieres, aunque nunca nadie se haya preocupado de quitar una piedrecita…", "g": ["archivo", "relatos", "relaciones"]}, {"f": "2010-11-25", "t": "La moneda del destino", "u": "/blog/2010/11/25/la-moneda-del-destino/", "r": "Cuando tengo que tomar una decisión que tal vez pueda desenvocar en problemas o considere que es una locura, decido lanzar una moneda, a la cual llamo, la moneda del destino. Hoy, es el cumpleaños de Dormael, la chica que conocí el otro día, y que ademas, menciono que quería una \"moneda de esas\". Asi que aqui estoy, haciendo un tutorial sobre como quedar \"toh proh\" haciendo un regalo barato, sencillo, pero muy personal y reshulon. MATERIALES NECESARIOS Algo para coser,…", "g": ["archivo", "diario"]}, {"f": "2010-11-28", "t": "Mi segunda cueva", "u": "/blog/2010/11/28/mi-cueva/ 011-01-29", "t": "Si…Si…Si…Simio!", "u": "/blog/2011/01/29/manumonoverde/", "r": "Siete de Enero de Mil Novecientos cincuenta, un Lipotes vexillifer chapotea junto a su pareja tranquilamente por el río Yangtze, unas horas mas tarde, el pequeño delfín, contempla como su amada da a luz a varios delfincillos, todos ellos de un color rosadito propio de la especie, pero eso, ahora mismo no nos importa, porque esa especie ya lleva años extinta y por mucho que nos pese, el tiempo pasado, es pasado. Cincuenta y cuatro años mas tarde de que muriera el Lipotes…", "g": ["archivo", "relatos", "humor"]}, {"f": "2011-02-05", "t": "Friki, la historia hasta ahora", "u": "/blog/2011/02/05/friki-la-historia-hasta-ahora/", "r": "Empezaremos por el presente mas presente, por este mismísimo instante. Friki esta leyendo estas palabras en voz alta a través de su móvil porque le he pedido que lo haga. Yo, me encuentro al otro lado, a la espera de que pronuncie la palabra “timbre”. ¿RING? El sonido que producirá el timbre al pulsarlo, quien contestara a este y lo que sucederá después, escapa totalmente a lo que pueda predecir, así que dejare esa historia para cuando sepa como termina. Ahora toca explicar…", "g": ["archivo", "diario"]}, {"f": "2011-02-06", "t": "Mi viaje a Madrid", "u": "/blog/2011/02/06/mi-viaje-a-madrid/", "r": "Una vez cada seis años, no hace daño. ^\\^ Espero que repitamos pronto! Un fuerte abrazo, Friki!", "g": ["archivo", "diario"]}, {"f": "2011-02-07", "t": "Troleo: ¿Que es?", "u": "/blog/2011/02/07/troleo-a-una-vieja-amiga/", "r": "Ante todo, esta es una entrada para tomarsela con humor, nada va en serio, si no eres capaz de entenderlo... La palabra trol se ha extendido como la pólvora últimamente, y su significado se ha pluriempleado tanto, que forma parte no solo de un acto internauta, sino de cualquier acto, independientemente de donde sea realizado, que provoque enfado, confrontaciones o sencillamente caos generalizado. La premisa es muy simple, no dejar indiferente a nadie. Hay muchas formas de…", "g": ["archivo", "humor"]}, {"f": "2011-02-16", "t": "Quedada bloguera: Nueva pipol!", "u": "/blog/2011/02/16/quedada-bloguera-nueva-pipol/", "r": "Lo primero y mas importante, presentar a la gente, para que no os volvais todos locos: - Malkev: Esta es fácil, mi personita. =D Tiene un blog muy chachi guay donde la gente va a tirarle piedras, podéis llegar a el dando click aquí. - Carcayú: No llegue a conocerle demasiado, pero lo poco que pude disfrutar de su presencia fue realmente agradable. Una persona con un sentido del humor muy a flor de piel, y un gran jugador de Munchkin a lo cerdo, usease, a lo pro. Tiene un…", "g": ["archivo", "diario", "meta"]}, {"f": "2011-02-19", "t": "Púrpura", "u": "/blog/2011/02/19/purpura/", "r": "Febrero de dos mil nueve Malkev Otro día mas, y encima, domingo. No he tocado la cama en toda la noche, he caído rendido sobre la mesa del ordenador. Anoche, en un estúpido intento de parar el tiempo, o por lo menos intentar ralentizarlo un poco para poder así hacer el sábado unos minutos mas largo, me quede la ultima parte de la noche mirando el monitor sin hacer absolutamente nada, eso es lo ultimo que recuerdo. Me despierta mi mujer, ya ha llegado de pasar la noche con…", "g": ["archivo", "relatos"]}, {"f": "2011-03-01", "t": "Sin ti no hay vida", "u": "/blog/2011/03/01/sin-ti-no-hay-vida/", "r": "Juno Temple, actriz que me tiene enamorado, en la película de Mr. Nobody se tiñe de castaño, y me recuerda horrores a Helena. Llamadme obseso si queréis, pero no soy el único que piensa igual. Una noche mas, cazo al personal desprevenido para forzarles a ver la que es una de mis películas favoritas. Termina la sesión y cada uno se va a su respectiva casa, pero el mensaje enviado directamente a mi cerebro perdura, en este caso, solo tienes una oportunidad para decidir. Mis…", "g": ["archivo", "diario", "cine"]}, {"f": "2011-03-01", "t": "Sobre un puente azul", "u": "/blog/2011/03/01/sobre-un-puente-azul/", "r": "No puedo evitar pensar en lo estúpido de mi fe hacia algunas personas, no puedo evitar ser un iluso cuando se trata de alguien importante para mi, no puedo evitar imaginarme un mundo de cine conmigo como protagonista, no puedo evitar ver como el tiempo se lo lleva todo y yo sigo impasible luchando contra la realidad, no puedo evitar luchar contra el hacerme mayor una y otra vez, no puedo evitar ser quien soy, porque sin eso, soy un Don Nadie. --- A lo lejos veo una forma, es…", "g": ["archivo", "diario"]}, {"f": "2011-03-07", "t": "Con otros ojos", "u": "/blog/2011/03/07/con-otros-ojos/", "r": "AVISO: ENTRADA MALKEVCENTRISTA Se refiere a una serie de comentarios sobre la ultima publicación. Este, concretamente: Lauraenriketa: Una escena mil veces oída y leída pero con especial sentimiento esta vez, ya que esta basada en hechos reales. Me parece perfecto que te atrevas a ir más allá de las ensoñaciones y des el paso, sin duda algún día te sonreirá la suerte! por cierto tu ex tampoco es para tanto… Malkev: Espero que así sea. Y el comentario extra me ha hecho reír de…", "g": ["archivo", "meta"]}, {"f": "2011-03-13", "t": "Superpoderes subestimados", "u": "/blog/2011/03/13/superpoderes-subestimados/", "r": "Tema del Primer Blog Carnival Freak: Superpoderes subestimados Elige tres superpoderes subestimados o un superpoder molón. Si bajara un superheroe amargado, cuyo superpoder es conceder superpoderes chorras, lo que es a su vez un superpoder chorra, no sabría que contestar, porque me pillaría en frío, y probablemente elegiría algo relacionado con lo que estuviera haciendo en ese momento, lo cual puede ser la hacer desaparecer granos mágicamente, la habilidad para conectarme a…", "g": ["archivo", "humor", "blog-carnival"]}, {"f": "2011-03-17", "t": "Mis chicos", "u": "/blog/2011/03/17/mis-chicos/", "r": "-Tu, perrancano, no ves el bonito dia que hace? Sal al jardín anda, y juega un rato con la niña. -Ya podría haber salido tranquila y adicta a los vídeos, como yo, y no una loca hiperactiva como su madre. Puedo percibir sin tan solo mirarla que esta poniendo su mirada, esa que pone cada vez que le toco un poquito las narices y que tanto me gusta, una mirada solo superable por la que pone cada vez que la beso y le digo \"te quiero\". Me levanto del sofa, me dirijo hacia el…", "g": ["archivo", "relatos"]}, {"f": "2011-04-01", "t": "Sabia que algún día llegaría", "u": "/blog/2011/04/01/sabia-que-algun-dia-llegaria/", "r": "INCA, ISLAS BALEARES, ESPAÑA [Entra en la sala...\" tags: [archivo, relatos, humor, blog-carnival] redirectfrom: - /?p=2187/ --- 3ª edicion del Blog carnival freak ¿Qué tres cosas prescindibles llevarías a un Apocalipsis Zombi? --- INCA, ISLAS BALEARES, ESPAÑA [Entra en la sala Malkev Malkavian, antes del resurgimiento era lo que se conocía como un nini (ni estudia, ni trabaja) y se dedicaba a escribir regularmente sobre su vida en su blog. Como pasaba días y días sin ver el…"}, {"f": "2011-05-17", "t": "¿Que ha pasado?", "u": "/blog/2011/05/17/que-ha-pasado/", "r": "Personas mencionadas: -Lix -Diva -Ojoschachis -Rubia (LCMYAGQMEPLN)", "g": ["archivo", "diario"]}, {"f": "2011-07-27", "t": "Conociendo a Inma", "u": "/blog/2011/07/27/conociendo-a-inma/", "r": "No voy a extenderme demasiado en lo que respecta a mi vida en la plaza, porque eso lo haré en otra entrada. Como toda historia que se precie, empieza con un momento clave, y ese momento, en este caso, es esa efímera eternidad que me invade cuando descubro unos ojos nuevos. Conozcamos un poco esos ojos. …. Habían pasado ya varios días desde mi fuga hacia la vida real, ese mundo que creía conocer, pero solo de oídas, como la mayoría de la gente hoy en día. Me encontraba una…", "g": ["archivo", "diario", "relaciones"]}, {"f": "2011-08-10", "t": "Conociendo a Malkev", "u": "/blog/2011/08/10/conociendo-a-malkev/", "r": "Entrada escrita por Inma Se que te hubiera gustado que escribiera mi versión de la historia. Y decido hacerlo ahora para que puedas entenderme y
