lo, pero aun así, a pesar de ser amigos verdaderamente íntimos, casi la pareja perfecta, algo impedía que hubiera algo mas, una simple aunque abrumadora cosa, su sexualidad. Si, lo que sigue a continuación es la declaración…", "g": ["archivo", "diario", "relaciones"]}, {"f": "2011-09-05", "t": "Tabúes", "u": "/blog/2011/09/05/tabues/", "r": "Te voy a decir la absoluta verdad de tu vida y es que no seras con el que se quedan las mujeres, pero si eres con el que sueñan, tus ex mas que ningunas. Y es que tu madre no solo te hizo soñador, sino también inolvidable. Anímate. Uno de los dos mensajes de texto escritos por una persona de la que no revelare el nombre porque puedo causarle problemas, leído al despertar mientras desayunaba leche con Nesquik a la una y media de la madrugada. Un rato mas tarde, empezamos a…", "g": ["archivo", "diario"]}, {"f": "2011-09-08", "t": "Papi", "u": "/blog/2011/09/08/papi/", "r": "Hoy voy a hablar de mi papi, el hombre que me dio la vida, a pesar de no haber sido de forma voluntaria. En sus pelotas estuve nadando una buena temporada, y el día clave en que decidió echar una rapidito con mi madre, gané la carrera que me concedería la oportunidad de ser quien soy ahora. Siempre se me dio bien correr. Mi padre, que me saca mas o menos un palmo de altura, es físicamente bastante parecido a mi, y se conserva muy bien. Sus ojos son verdes, aunque no como los…", "g": ["archivo", "diario", "humor"]}, {"f": "2011-09-09", "t": "Ayúdame a ayudarte", "u": "/blog/2011/09/09/ayudame-a-ayudarte/", "r": "", "g": ["archivo", "diario"]}, {"f": "2011-09-12", "t": "Taquicardico", "u": "/blog/2011/09/12/taquicardico/", "r": "Hoy me había propuesto tener un día tranquilo, porque a pesar no trabajo ni hago demasiado, no me gustan los lunes, y menos los lunes que preceden a malas noticias. Noticias como que no te han pagado el paro, te llaman de Timofonica llamandote moroso y te cobren un mes de linea que no has usado, porque el mes anterior ya te la cortaron. Pero eso dejemoslo a un lado, porque se arreglara pronto. Ahora mismo, estoy estresado, estresadisimo, taquicardico sería la palabra, y…", "g": ["archivo", "diario"]}, {"f": "2011-09-13", "t": "Martes 13", "u": "/blog/2011/09/13/martes-13/", "r": "Sinceramente, me esperaba que el día de hoy fuera mucho peor de que realmente ha sido, pero aun así, acabo de llegar a casa con un sabor de boca verdaderamente amargo. Voy a intentar explicar punto por punto lo que ha pasado este día. Aclaro que no soy supersticioso ni hostias pardas, solo era por poner algún titulo, pero también es cierto que hoy ha sido un cumulo de desgracias y casualidades desagradables. Las cuatro de la mañana, yo estaba durmiendo. Había decidido irme…", "g": ["archivo", "diario"]}, {"f": "2011-09-13", "t": "Un día y medio", "u": "/blog/2011/09/13/un-dia-y-medio/", "r": "Esta entrada es pura locura macabra y surrealista, no hay que tomarse nada de esto en serio, lo escribo sencillamente porque había empezado a hacerlo y no me gusta dejar las cosas a medias. TEXTO", "g": ["archivo", "relatos"]}, {"f": "2011-09-14", "t": "Despedida Lix", "u": "/blog/2011/09/14/despedida-lix/", "r": "", "g": ["archivo", "diario"]}, {"f": "2011-09-15", "t": "¿Un cuento de hadas? I", "u": "/blog/2011/09/15/un-cuento-de-hadas-i/", "r": "T", "g": ["archivo", "relatos"]}, {"f": "2011-09-16", "t": "Dos formas de ver las cosas", "u": "/blog/2011/09/16/dos-formas-de-ver-las-cosas/", "r": "Pensamientos en voz alta.", "g": ["archivo", "diario"]}, {"f": "2011-09-19", "t": "El caso \"Primer\"", "u": "/blog/2011/09/19/el-caso-primer/", "r": "La primera vez que vi \"Primer\" quedé fascinado, sobre todo cuando vi los créditos. Me empece a interesar por todo lo que la envolvía, el Director, el actor secundario, el bajisimo presupuesto... y por supuesto, la linea temporal, tan difícil de descifrar pero a la vez tan bien montada que parecía que me llamaba. Había entendido el funcionamiento de la maquina, pero me había quedado perplejo con el desarrollo de la trama. Necesitaba volverla a ver. La segunda vez, empece a…", "g": ["archivo", "cine"]}, {"f": "2011-09-29", "t": "Celos vampiricos", "u": "/blog/2011/09/29/celos-vampiricos/", "r": "No, tranquilos, no voy a hablar de Crepúsculo. Son celos de los de verdad, de los de una Vampiresa gótica y demente de las de la vieja escuela, esas que te chupan la sangre, entre otras cosas, y te dejan seco. Estamos a principios del dos mil nueve, mas o menos, y llegaba yo de una guardia de veinticuatro horas, cansado, por supuesto, y un poco mas agobiado de lo normal, porque la convivencia estaba siendo un verdadero caos y no veía forma de arreglarlo. Habia conocido a una…", "g": ["archivo", "diario", "humor"]}, {"f": "2011-10-06", "t": "Preparando el camino", "u": "/blog/2011/10/06/preparando-el-camino/", "r": "Bueno, parece que el día se acerca. En menos de un mes, estaré viviendo en Valencia, en un zulo con otros estudiantes guarretes, buscando un trabajito de mala muerte y subsistiendo como se pueda. Pero todo eso no importa absolutamente nada si lo comparo con lo que simboliza, una nueva vida. Antes de elegir Valencia, se me llegaron a pasar por la cabeza otras opciones, entre ellas Madrid, Barcelona o seguir con la vida de mochilero en dirección a Francia. Entonces, por qué…", "g": ["archivo", "diario", "valencia"]}, {"f": "2011-11-02", "t": "El reencuentro", "u": "/blog/2011/11/02/el-reencuentro/", "r": "JUEVES Toco el suelo de Valencia, bueno, antes de eso toco la escalerilla cutre del avión de Ryanair que parece que se vaya a caer en cualquier momento. No estoy escuchando música, tengo que ahorrar batería, así que me dejo envolver por las conversaciones ajenas, sonidos de aterrizajes y despegues e incluso el despedir de las azafatas, esa es mi banda sonora. Ahora si, toco el suelo. Nadie me espera, es normal, teóricamente solo dos o tres pocas personas saben que estoy…", "g": ["archivo", "diario", "valencia"]}, {"f": "2011-11-08", "t": "Empezar las cosas con mal pie", "u": "/blog/2011/11/08/empezar-las-cosas-con-mal-pie/", "r": "En mi vida, las personas que me importan pueden contarse con los dedos de las manos, la chica a la que amo, mi mejor amiga, mi mejor y único amigo, las tres conocidas que casi ni conozco en persona pero que siempre me hablan por msn, dos miembros de mi familia y en menor medida, yo. En ocasiones, otras personas pasan por mi camino, me acompañan, me apoyan o son apoyadas por mi, pero su estancia es demasiado breve para que lleguen a calarme lo suficientemente hondo, se…", "g": ["archivo", "diario"]}, {"f": "2011-11-11", "t": "Arrodillaos ante mí, sucios mortales!", "u": "/blog/2011/11/11/arrodillaos-ante-mi-sucios-mortales/", "r": "Nueva edicion del Carnival Freak Si fueras un ser sobrenatural, ¿qué serías? — Día uno, lunes Miles de millones de personas mueren por combustión espontanea, el caos generalizado aparece ante tal espectáculo, no parece haber un patrón definido y nadie sabe si será el siguiente. Las grandes naciones se echan la culpa unas a otras sin saber siquiera de que se trata. Nacho Vidal escribe en su Twitter \"Estoi k ardo\" En los principales centros políticos del planeta, parece haber…", "g": ["archivo", "relatos", "blog-carnival"]}, {"f": "2011-11-17", "t": "El poder de las palabras", "u": "/blog/2011/11/17/el-poder-de-las-palabras/", "r": "De: Anónima Esmeralda Para: Malkev Malkavian Asunto: Sin asunto Buenas noches. Espero que estés en un lugar cálido, yo tengo un frío increíble. Antes de nada, debes saber que no me conoces. En realidad yo tampoco te conozco a ti, no al menos en el sentido literal del verbo \"conocer\", y tampoco en el sentido figurado, pero al menos, yo sé de tu presencia. De echo, llevo meses leyendo las cosas que publicas, interesándome por ellas como si te conociese y temiese por ti,…", "g": ["archivo", "meta"]}, {"f": "2011-11-18", "t": "Una cajita de cerillas", "u": "/blog/2011/11/18/una-cajita-de-cerillas-de-cera/", "r": "\" tags: [archivo, diario] published: false redirectfrom: - /?p=3149/ --- Cerillas de cera Helena Dieciocho, te suena de algo ese numero? ---"}, {"f": "2011-12-12", "t": "Soy una pestaña en tu monitor", "u": "/blog/2011/12/12/soy-una-pestana-en-tu-monitor/", "r": "Ahora mismo estarás a mil kilómetros de mi, o quizás a tan solo unos metros, pero yo jamás lo sabré, y tú no intentaras cambiarlo, y no lo harás porque no soy más que una pequeña pestaña en tu navegador, o quizás ni eso. Seguidores de Twitter, de Formspring, amigos en Facebook, contactos en Google+, cualquier otro apodo cariñoso en cualquier otra red social... no significan nada para mi, no me parecen más que números y frases vacías, gente con la que hablo hoy porque están…", "g": ["archivo", "diario"]}, {"f": "2011-12-17", "t": "Carta a Monesvol", "u": "/blog/2011/12/17/carta-a-monesvol/", "r": "Otra edición del Carnival Freak Carta de navidad — Querido Monstruo de Espaghetti Volador, este año he sido un niño muy bueno, he comido mucha pasta sagrada, salsa autentica y jamás he dicho que no a unas buenas albóndigas. Se que no concedes regalos, pero ya que tus competidores directos están que lo tiran, espero que tu tallarinesco sentido de la bondad y pique, pueda concederme alguno de estos tan esperados y preciados deseos. Me gustaría tener un hermanito mayor, con el…", "g": ["archivo", "humor", "blog-carnival"]}, {"f": "2012-01-12", "t": "Nyanentrada", "u": "/blog/2012/01/12/nyanentrada/", "r": "\" tags: [archivo, meta, humor] redirectfrom: - /?p=3335/ --- Simplemente, dale click ;-) NYANIZATE! ~~Vale, si, esta entrada es para que sepáis que no he muerto. ñ\\ñ~~ ---"}, {"f": "2012-02-07", "t": "Cuatro meses", "u": "/blog/2012/02/07/cuatro-meses/", "r": "Esta no es una anécdota de esas tristes o locas que siempre cuento sobre mi vida, ni siquiera está terminada, es sencillamente una especie de preludio hacia una enorme historia que está empezando.Han pasado cuatro meses desde que pisé Valencia, aún no he terminado de hacerme a la idea, es una mezcla entre un sueño y llevar toda la vida aquí, aunque a veces tengo la sensación de haber llegado ayer. Es raro... pero mola que lo flipas. En este corto periodo de tiempo he vivido…", "g": ["archivo", "diario", "valencia"]}, {"f": "2012-02-10", "t": "Puerta fría", "u": "/blog/2012/02/10/puerta-fria/", "r": "Con mi americana cutre de ante, los pantalones negros más sosos que tenía, una corbata negra con símbolos de poker y una camisa blanca como armadura, con mi cuasi inexistente labia, una carpeta con apuntes y contratos como arma y con una sonrisa como escudo, me encontraba yo pateando las calles de Valencia en busca de victimas. La escasez absoluta de curro y la desesperación habían ido acrecentando el rango de búsqueda de trabajos. Ya no importaba el qué, mientras diera…", "g": ["archivo", "diario", "valencia"]}, {"f": "2012-02-24", "t": "El reto de la canela", "u": "/blog/2012/02/24/el-reto-de-la-canela/", "r": "\" tags: [archivo, retos, humor] redirectfrom: - /?p=3411/ --- Ya que está tan de moda el Cinnamon challenge ese, que no tiene nada que ver con los digimons, por cierto, pues me he dicho, ea! Yo también! ---"}, {"f": "2012-05-02", "t": "El reto del conejito rechoncho", "u": "/blog/2012/05/02/el-reto-del-conejito-rechoncho/", "r": "Otro reto realizado!! ¿Alguna idea para el siguiente? =D", "g": ["archivo", "retos", "humor"]}, {"f": "2012-07-07", "t": "Alta fidelidad (High Fidelity)", "u": "/blog/2012/07/07/alta-fidelidad-high-fidelity/", "r": "Titulo en Español: Alta fidelidad Titulo original: High Fidelity Duración: 1 hora y 47 minutos (107 min.) Palabras clave para definir el film: Comedia. Música. Años 80. Procedencia: Estados Unidos Del año: 2000 Dirección: Stephen Frears Guión: D.V. DeVicentis, Steve Pink, John Cusack, Scott Rosenberg (Basado en la novela de Nick Hornby) Reparto principal: John Cusack, Jack Black, Joelle Carter, Iben Hjejle, Tim Robbins, Joan Cusack, Lili Taylor, Lisa Bonet, Sara Gilbert,…", "g": ["archivo", "cine"]}, {"f": "2012-10-15", "t": "Zombinoia", "u": "/blog/2012/10/15/zombinoia/", "r": "Me gustan los zombis, soy un gran fan de esos monstruos muertos vivientes. Todo lo que envuelve ese cadavérico cuerpo me parece atrayente y morboso, sobre todo la historia de los que tienen que convivir junto a ellos. Desde las primeras películas que aparecieron hasta los últimos libros que tan de moda están, todas esas historias de zombis clásicos me encantan, esos que no son más que una sombra de lo que eran en vida pero que son verdaderamente mortales por su numero. Me…", "g": ["archivo", "videojuegos"]}, {"f": "2012-11-14", "t": "Necesito unas vacaciones", "u": "/blog/2012/11/14/necesito-unas-vacaciones/", "r": "Tenía que pasar tarde o temprano, y a decir verdad, ha tardado mucho más de lo que me gustaría, pero por fin mis dedos están descargando la tensión acumulada alrededor de mi garganta, esa que me estaba ahogando poquito a poco. Lo que más me entristece de todo es que se hayan tenido que alinear los planetas para eso, y no se cuando volverá a suceder. Burbujita tiene que estudiar, no quedo con los del club, no trabajo, he pasado de hacer la partida de rol, tengo hecho por…", "g": ["archivo", "diario"]}, {"f": "2012-12-14", "t": "Gracias", "u": "/blog/2012/12/14/gracias/", "r": "Miro el calendario y no puedo creer lo rápido que pasa el tiempo. Ayer estaba subiendo las pocas cajas que contenían lo que se podría considerar toda mi vida, a un cutre piso de mala muerte, y hoy, llevo más de un año en Valencia. Es como si hubiera sido un simple parpadeo, un rápido jadeo, esa fracción de segundo en la que te dejas caer en el sofá, y todo eso, te lo debo a ti, porque cuando eres feliz, todo pasa más deprisa. Gracias. Debo reconocer y reconozco, que a veces…", "g": ["archivo", "diario", "valencia"]}, {"f": "2013-02-06", "t": "Momentos complicados", "u": "/blog/2013/02/06/momentos-complicados/", "r": "Hay momentos en la vida en la que tu canción deja de ser tu canción, momentos en lo que te miras al espejo y no te ves a ti mismo sino a un desconocido, momentos en los que no te sientes fuerte, ni débil, ni triste, ni alegre, momentos de cambio, de madurez, de avanzar, momentos en los que necesitas huir lejos pero sin moverte del sitio, momentos en los que una brisa del pasado te abraza, te corta, te mece, te azota, te besa y te amenaza, momentos de caos y control mutuo,…", "g": ["archivo", "diario"]}, {"f": "2013-03-21", "t": "Un poco de movimiento", "u": "/blog/2013/03/21/de-vuelta/", "r": "Soy consciente de lo estúpido de la moda y lo poco que le gusta a mucha gente esta mierda, pero he de reconocer que algunos son bastante graciosos. El caso, que hago esta entrada como petardazo inicial en señal de que estoy volviendo a poner esto en marcha, que me estoy moviendo, terminando ya de dejar bonica la pagina y que en breves, vuelvo a ponerme en serio con el contenido. ¡Vuelvo a la blogosfera hamijos! Así que... DO THE HARLEM SHAKE ---", "g": ["archivo", "meta", "humor"]}, {"f": "2013-03-28", "t": "Siete sueños I", "u": "/blog/2013/03/28/siete-suenos-i/", "r": "Últimamente estoy teniendo sueños bastante extraños. Normalmente son raros, pero hay algunos que se llevan la palma, y ya que estaba en racha he decidido ir apuntándolos en un papelito para describirlos después. Quizás algún día tenga un psicoterapeuta que se frotará las manos con tanta absurdez y podrá sacarme el dinero a gusto durante meses y meses, pero mientras tanto, pues los apunto por aquí. Como es la primera entrada que voy a escribir sobre los sueños, ya que tengo…", "g": ["archivo", "sueños"]}, {"f": "2013-03-30", "t": "Creando un juego de rol: Las bases (I)", "u": "/blog/2013/03/30/creando-un-juego-de-rol-i/", "r": "Estas ultimas semanas me he enfrascado por fin en un proyecto que hacía mucho tiempo que tenía en mente. El empujón definitivo que me ha llevado a dar el paso ha sido tener un colega que ya ha creado su propio juego de rol, además del estar leyendo mucho sobre el tema de los sandbox y los módulos caseros últimamente. Muchas veces, cuando miro alguna serie, película o leo un libro que me gusta, una pequeña parte de mi desea jugar a un juego de rol ambientado en esa historia,…", "g": ["archivo", "rol"]}, {"f": "2013-04-03", "t": "Castaway on The Moon", "u": "/blog/2013/04/03/castaway-on-the-moon/", "r": "Titulo en Inglés: Castaway on The Moon Titulo original: Kim-ssi-pyo-ryoo-gi (Kimssi pyoryugi) (La isla de Kim) Duración: 1 hora y 54 minutos (116 min.) Palabras clave para definir el film: Romance. Drama. Comedia. Procedencia: Corea del sur. (La buena, no la comunista) Del año: 2009 Dirección y guión: Lee Hae-Joon (también conocido como Lee Hae-Jun) Reparto principal: Jeong Jae-Yeong y Jeong Ryeo-Won. Puntuación: 9,1/10 Sinopsis Un pringao de la vida, abandonado por su mujer…", "g": ["archivo", "cine"]}, {"f": "2013-04-16", "t": "Perder el Juicio", "u": "/blog/2013/04/16/perder-el-juicio/", "r": "El otro día me dijeron que si buscabas \"Malkevnia\" o mi nombre por Bing, te aparecían dos cosas la mar de curiosas. Una de ellas es algo que al parecer se ha colado dios sabrá como en el servidor, que no se ni que es, ni tampoco me importa demasiado, pero que voy a dejar porque aparte de no ser malicioso, me parece una mezcla entre lo bizarro y lo gracioso (Si alguien me lo puede explicar, sería genial). La otra cosa es un BOIB, donde se explica entre otras cosas, la…", "g": ["archivo", "meta"]}, {"f": "2013-04-19", "t": "Creando un juego de rol: Panacea, la no magia (II)", "u": "/blog/2013/04/19/creando-un-juego-de-rol-panacea/", "r": "En la entrada anterior exponía las bases de lo que iba a ser el juego de rol. Esta vez me voy a centrar únicamente en lo que estaba siendo uno de mis dolores de cabeza más grandes, la \"no magia\", un termino improvisado para limitarme a la hora de meter cosas \"ilógicas\", pues no quiero que termine siendo esto un duelo de magia al estilo de los hechiceros de toda la vida. No me voy a andar con rodeos respecto al secretismo de la realidad sobre Panacea, pero se tiene que tener…", "g": ["archivo", "rol"]}, {"f": "2013-04-25", "t": "El momento perfecto", "u": "/blog/2013/04/25/el-momento-perfecto/", "r": "Unos pocos días al año, tan pocos que podrían contarse con los dedos de una sola mano, sucede algo verdaderamente maravilloso. Esos extraños y escasos días, en los que no me duele la espalda, la cabeza o cualquier otra cosa y duermo solo, tirado en el sofá en mitad del salón, con la luz de una farola entrando a través de las persianas y las cortinas, terminan siempre con un instante mágico y especial al que llamo \"el momento perfecto\". Tras un día productivo, de haber…", "g": ["archivo", "diario"]}, {"f": "2013-04-26", "t": "First World Problems (Malkev version)", "u": "/blog/2013/04/26/first-world-problems-malkev-version/", "r": "Y es que a veces los problemillas más estúpidos nos parecen montañas, y nos olvidamos de tiempos peores en los que realmente lo pasamos fatal, o sencillamente, no somos capaces empatizar y ponernos en el lugar de gente que está verdaderamente mal e infinitamente peor que nosotros. Un poco de autoparodia y humor sobre uno mismo, siempre ayuda a ver las cosas de otra manera. Be happy. :;): ---", "g": ["archivo", "humor"]}, {"f": "2013-05-01", "t": "Siete sueños II", "u": "/blog/2013/05/01/siete-suenos-ii/", "r": "Pelea a muerte sobre un palé Frente a mi está mi adversario, sin rostro pero con muy mala leche. Está armado con un serrucho de costilla, y al parecer, yo con una sierra de marquetería, ambas nuevecitas y relucientes. Estamos cayendo al vació a bordo de un palé, se ven las nubes pasarnos de largo aunque no se aprecia el suelo, la sensación de que la física nos afecta de forma extraña, puedo saltar, caminar y esquivar sin dificultad, pero si corto un pedazo de palé con la…", "g": ["archivo", "sueños"]}, {"f": "2015-10-07", "t": "Cuatro años", "u": "/blog/2015/10/07/cuatro-anyos/", "r": "Compañera de fatigas No soy un buen amigo, ni tan solo un buen colega. No soy alguien con el que contar para salir de marcha o tomar unas birras. Soy introvertido, solitario, ligeramente depresivo y tengo tendencia a apartar a la gente de mi lado. Y encima, no sé hacer regalos. Pero a pesar de todo eso, a pesar de la montaña andante de defectos que soy, una incansable luchadora sigue junto a mi al pie del cañón. Una increíble muchachita que tiene la increíble capacidad de…", "g": ["archivo", "diario"]}, {"f": "2015-10-07", "t": "Manual de instrucciones", "u": "/blog/2015/10/07/manual-de-instrucciones/", "r": "Manual de instrucciones Malkev T-77 ATENCION Una vez agotada la vida útil de este producto, no lo tire a la basura doméstica. Deposítelo en el contenedor adecuado, para su posterior reciclado. INTRODUCCIÓN El humano bioelectrico Malkev modelo T-777 viene con todos los accesorios de serie. De fácil lavado, batería autorecargable solo sera necesario prestarle atención varias horas a la semana y estará listo para cumplir cualquier función que se le asigne. MEDIDAS DE SEGURIDAD…", "g": ["archivo", "relatos", "humor"]}, {"f": "2015-10-07", "t": "Tres parejas (+18)", "u": "/blog/2015/10/07/tres-parejas/", "r": "Y los acontecimientos sucedían como probablemente todos los invitados a la fiesta habíamos imaginado, algo dentro de nosotros lo sabía, y probablemente, una versión oscura y pervertida de nuestra personalidad así lo deseaba, allí estábamos, unos cuantos amigos, gente de confianza, conocidos desde hacía años, tres parejas tomando unas copas frente a la chimenea en pleno invierno y dejando que todo fluya en la burbuja que se había convertido esa casa. El anfitrión de la…", "g": ["archivo", "relatos", "relaciones"]}, {"f": "2015-10-24", "t": "El trascender del momento", "u": "/blog/2015/10/24/nostalgia/", "r": "Existe un lugar en el tiempo donde el ahora es eterno. Un refugio de tempestades, para el errante viajero. Allí busca cobijo en las frías noches de invierno. Encontrará cincelado, en el marmol del recuerdo, una mirada perdida, una duda, un momento. Y en mitad de la sala, congelados dos amantes, intercambian palabras, sin decirse nada.", "g": ["archivo", "poesía"]}, {"f": "2016-07-15", "t": "Proyecto Arca · I. El Despertar", "u": "/blog/2016/07/15/proyecto-arca-01-el-despertar/", "r": "Índice de la novela Academia Arca, julio de 2016 La Sala del Despertar Para todos fue igual: una voz, una mano capaz de cubrir una montaña, y la sensación de no ser nada. Daba lo mismo estar a la orilla del mar, al pie de una cordillera o en mitad de una llanura. La voz decía siempre lo mismo. «La Casa te llama. Tienes un lugar en Arca. Dejarás tu pasado atrás; lo que eras ya no será. A cambio aprenderás, mejorarás, y recibirás una oportunidad para salvar tu tierra, o para…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-08-05", "t": "Proyecto Arca · II. La Academia", "u": "/blog/2016/08/05/proyecto-arca-02-la-academia/", "r": "‹ Capítulo anterior: I. El Despertar · Índice Academia Arca, agosto de 2016 El Guardián del Norte La bestia que salió del bosque era el doble de grande que el vehículo, y embestir contra ella con una oruga blindada no resultó la idea brillante que parecía. Durante un buen rato la criatura los zarandeó a cabezazos, atrapó a Fénix entre las fauces y estuvo a punto de volcarlos. La sacaron adelante a base de insistencia: Kendra le clavó el arpón y la fue acercando al casco a…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-08-13", "t": "Proyecto Arca · III. Lo que somos", "u": "/blog/2016/08/13/proyecto-arca-03-lo-que-somos/", "r": "‹ Capítulo anterior: II. La Academia · Índice Academia Arca, agosto de 2016 La Mansión Cronos A los dos Relojeros los citaron en una mansión de la Plaza Mayor, un edificio de fachada blanca y puertas barrocas en madera y pan de oro, vigilado desde lo alto por gárgolas de mármol. Tabris llegó el primero, y llegó tarde. -Es increíble que sea capaz de controlar el tiempo y siempre llegue cinco minutos tarde. Vance apareció poco después, con una mezcla de curiosidad y…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-08-21", "t": "Proyecto Arca · IV. El nuevo director", "u": "/blog/2016/08/21/proyecto-arca-04-el-nuevo-director/", "r": "‹ Capítulo anterior: III. Lo que somos · Índice Academia Arca, agosto de 2016 Las clases y el Coliseo A partir del 17 de agosto, durante unos días, la Academia se pareció de verdad a una escuela. Empezaron las clases. El curso de Conocimiento sobre el Cataclismo era obligatorio para todos, y a partir de ahí cada uno acudía a las materias que había elegido. Los profesores eran una colección tan variopinta como los alumnos: un doctor en historia de mirada incómoda, una…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-09-15", "t": "Proyecto Arca · V. La única ley", "u": "/blog/2016/09/15/proyecto-arca-05-la-unica-ley/", "r": "‹ Capítulo anterior: IV. El nuevo director · Índice Academia Arca, septiembre de 2016 La enfermería Tabris había invitado a Egia a un duelo en el Coliseo, y subió al cuadrilátero con su mejor sonrisa. -¿Cómo no iba a jugar con una niñita tan encantadora? Fue el peor cálculo de su vida. La niña de ocho años, de aspecto inofensivo y vestido celeste, lo recibió con un Rugido que le metió el miedo en el cuerpo, le hizo perder pie y, cuando lo tuvo en el suelo, le dejó caer…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-10-15", "t": "Proyecto Arca · VI. El Hombre del Saco", "u": "/blog/2016/10/15/proyecto-arca-06-el-hombre-del-saco/", "r": "‹ Capítulo anterior: V. La única ley · Índice Academia Arca, octubre de 2016 El Bufón y el pintor Una de aquellas noches, Tabris se paseó por el Barrio Artístico, que era un mar de ciudadanos convertidos en piedra. Gente que no había hecho otra cosa que disfrutar de la genialidad de los pocos individuos realmente únicos de Arca, y que ahora eran estatuas, y el silencio absoluto lo dejaba vacío y nostálgico. Arca necesitaba color, decidió. Arca necesitaba arte. Se colocó una…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-11-15", "t": "Proyecto Arca · VII. La silla vacía", "u": "/blog/2016/11/15/proyecto-arca-07-la-silla-vacia/", "r": "‹ Capítulo anterior: VI. El Hombre del Saco · Índice Academia Arca, noviembre de 2016 La noche de Baal Durante cuatro noches, el Parque de Atracciones se quedó con ellos. Cada uno recorrió la atracción que la ruleta del Hombre del Saco le había asignado, un mundo de carnaval podrido donde cada juego escondía una trampa y cada premio un precio. Y a la cuarta noche llegó lo que el Hombre del Saco había prometido: la noche de Baal. De lo que ocurrió aquella noche, los que…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2016-12-20", "t": "Proyecto Arca · VIII. La Noche Blanca", "u": "/blog/2016/12/20/proyecto-arca-08-la-noche-blanca/", "r": "‹ Capítulo anterior: VII. La silla vacía · Índice Academia Arca y Academia Longinus, diciembre de 2016 y enero de 2017 La Noche Blanca Hay en Izaro una noche al año parecida a la Navidad. La llaman la Noche Blanca, y cuentan que esa noche el Éter vibra y la luna llena flota más cerca que nunca, resplandeciendo como una joya que aparta la oscuridad y espanta a los Engendros. Una noche de paz para el justo, para el pobre, para el que sin merecerlo solo ha recibido dolor. Una…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-01-26", "t": "Proyecto Arca · IX. La hija de Jericó", "u": "/blog/2017/01/26/proyecto-arca-09-la-hija-de-jerico/", "r": "‹ Capítulo anterior: VIII. La Noche Blanca · Índice El Viaje de Kendra · Jericó, enero y febrero de 2017 El diente del Cazador El viaje empezó donde Kendra había nacido. La enviaron a Jericó, su tierra, la tierra de piel oscura y sol de plomo de la que su madre era hija y a la que ella misma se había ganado el derecho de pertenecer, y el viaje fue, desde el primer paso, una cosa suya y de nadie más. No había equipo, ni academia, ni cafetería. Solo el mapa, el calor, y ella.…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-02-05", "t": "Proyecto Arca · X. El veneno del valor", "u": "/blog/2017/02/05/proyecto-arca-10-el-veneno-del-valor/", "r": "‹ Capítulo anterior: IX. La hija de Jericó · Índice El Viaje de Kendra · Jericó, febrero de 2017 Bajo otra piel Para entrar en los campamentos sin que nadie la reconociera, Kendra tenía que dejar de ser Kendra. Anikura preparó el cambio en el mirador del jardín, removiendo una marmita de ingredientes que olían a muerto y consultando, muy en serio, la opinión de un esqueleto medio sumergido en la laguna. Resultó que el esqueleto era el abuelo de Anikura, y que de él salía…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-02-20", "t": "Proyecto Arca · XI. Cazadora y presa", "u": "/blog/2017/02/20/proyecto-arca-11-cazadora-y-presa/", "r": "‹ Capítulo anterior: X. El veneno del valor · Índice El Viaje de Kendra · Jericó, febrero y marzo de 2017 El consejo El caudillo de los Koi Koi cumplió su palabra y convocó a las tribus. En el centro del campamento se sentaron ancianos, ancianas y jefes, y, antes de que Kendra lo esperase, el caudillo la presentó y le cedió la voz. Kendra dijo lo que había venido a decir, y lo dijo sin rodeos. -Me da igual vuestro odio a la reina o vuestras nuevas creencias. Eso ya se…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-03-20", "t": "Proyecto Arca · XII. La boca de la sierpe", "u": "/blog/2017/03/20/proyecto-arca-12-la-boca-de-la-sierpe/", "r": "‹ Capítulo anterior: XI. Cazadora y presa · Índice El Viaje de Kendra · Jericó, marzo, abril y mayo de 2017 No lo condenaré El lobo de la laguna era un Caído, una de aquellas criaturas del Éter que no podían caminar por el mundo a menos que se uniesen a un humano y lo convirtieran en un Maldito. Y Kendra, para salir de aquel bosque de luna roja en el que el lobo la tenía atrapada, había cerrado un mal trato: encontrarle un candidato. La flauta de madera que se había…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-05-25", "t": "Proyecto Arca · XIII. Tú no eres solo tú", "u": "/blog/2017/05/25/proyecto-arca-13-tu-no-eres-solo-tu/", "r": "‹ Capítulo anterior: XII. La boca de la sierpe · Índice El Viaje de Kendra · Jericó, mayo y junio de 2017 Las marcas La fiesta siguió, y Kendra y Reich siguieron bebiendo y hablando. Reich, al que el licor de Jericó le iba pareciendo cada trago menos horrible, le sonsacó a Kendra una confesión a medias: que había un hombre, uno solo, que le había dejado el listón demasiado alto, y que se había prometido olvidarlo durante el viaje y le estaba costando. No era mujer de un solo…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-06-20", "t": "Proyecto Arca · XIV. Colmillos y garras", "u": "/blog/2017/06/20/proyecto-arca-14-colmillos-y-garras/", "r": "‹ Capítulo anterior: XIII. Tú no eres solo tú · Índice El Viaje de Kendra · Arca, junio y julio de 2017 Paciente Pandora El templo del sur había quedado inservible, y Kendra había vuelto a la Academia con dos cosas que no había pedido: una sombra parlanchina pegada a sus pasos y una niña inconsciente en brazos. La niña no era una niña. Era un arma que los Ascendidos habían fabricado contra Lilith antes de que el Imperio Gon arrasara sus templos, y que el proyecto, al…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-07-05", "t": "Proyecto Arca · XV. Padre", "u": "/blog/2017/07/05/proyecto-arca-15-padre/", "r": "‹ Capítulo anterior: XIV. Colmillos y garras · Índice El Viaje de Kendra · Jericó, julio de 2017 Pandora Bela se sentó al lado de Kendra, abrió el pergamino entre las piernas y la aguja de cristal se encendió. -Respira tranquila y no te muevas, ¿vale? Empezó a escribir y dibujar sobre el brazo de Kendra, dejando un trazo oscuro que no dolía demasiado pero quemaba más a cada línea. Tardó un buen rato, y dejó bastante sangre. Cuando terminó, la marca entera se iluminó y volvió…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-07-20", "t": "Proyecto Arca · XVI. Yo poseo la respuesta", "u": "/blog/2017/07/20/proyecto-arca-16-yo-poseo-la-respuesta/", "r": "‹ Capítulo anterior: XV. Padre · Índice El Viaje de Kendra · Jericó, julio y agosto de 2017 El dragón Subían las escaleras de la fragua cuando todo empezó a temblar. Cayó parte del techo, y un rugido lejano y desgarrador hizo que las bestias colgadas se retorcieran en sus cadenas. El Cazador se giró con los ojos abiertos de par en par. -No puede ser. ¿Qué habéis hecho, insensatos? -Dejar a una maldita Gon sola -dijo Kendra, ya corriendo hacia el pozo del dragón-. Ya dije que…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-08-08", "t": "Proyecto Arca · XVII. El mundo perfecto", "u": "/blog/2017/08/08/proyecto-arca-17-el-mundo-perfecto/", "r": "‹ Capítulo anterior: XVI. Yo poseo la respuesta · Índice El Viaje de Kendra · Jericó, agosto de 2017 La ciudad sagrada El olor a carne quemada salía de la grieta, y con él un calor agradable. Kendra decidió que descansarían allí; ella mandaba. Bajaron por una pendiente escarpada, despacio, sosteniendo a Reich, hasta una gruta subterránea con una laguna burbujeante que despedía vapor. Aguas termales. Una maldición en pleno desierto, dijo Bela, salvo de noche, cuando eran la…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-08-25", "t": "Proyecto Arca · XVIII. La Horca", "u": "/blog/2017/08/25/proyecto-arca-18-la-horca/", "r": "‹ Capítulo anterior: XVII. El mundo perfecto · Índice El Viaje de Kendra · Jericó y Arca, agosto y septiembre de 2017 Lo que me queda Kendra echó a andar, dando la serpiente por muerta y el asunto por cerrado. Una mano se cerró sobre su muñeca, firme como una tenaza, y la detuvo. -¿Y qué importa? -dijo el Cazador-. Esto era solo una misión de paso. Tu misión real es ser entrenada por mí. Y con esa actitud estás lejos de que comunique a la Academia que estás lista. -Me da…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-09-10", "t": "Proyecto Arca · XIX. Sin reflejo", "u": "/blog/2017/09/10/proyecto-arca-19-sin-reflejo/", "r": "‹ Capítulo anterior: XVIII. La Horca · Índice El Viaje de Kendra · Nod y Arca, septiembre de 2017 La huida de Nod Kendra le puso a Abel las esposas, que se iluminaron al cerrarse. Mientras las llevara, le explicó Raven, su poder quedaría anulado, y solo Kendra podría quitárselas. El resto del equipo fue llegando, magullado, manchado de sangre. Y entonces la tierra empezó a temblar. Brok, el hombre del brazo de piedra, salió disparado del suelo y aterrizó entre ellos. -Regia…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-09-25", "t": "Proyecto Arca · XX. El Proyecto Avatar", "u": "/blog/2017/09/25/proyecto-arca-20-el-proyecto-avatar/", "r": "‹ Capítulo anterior: XIX. Sin reflejo · Índice El Viaje de Kendra · Arca, septiembre, octubre y noviembre de 2017 El pozo de sacrificios -¡Quiero entrar! -dijo Kendra. El mundo se volvió borroso, y apareció en la jungla, junto a Kulum. Set seguía a su lado, deslizándose por el aire a grandes saltos. -Soy algo así como un cliente -le dijo. Empezaron a silbar balas. Kendra intentó contactar con Data, pedir que avisaran al General Luxis de que los Buscadores pretendían usarla…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-11-05", "t": "Proyecto Arca · XXI. La vieja sangre", "u": "/blog/2017/11/05/proyecto-arca-21-la-vieja-sangre/", "r": "‹ Capítulo anterior: XX. El Proyecto Avatar · Índice El Viaje de Kendra · Daelvania, noviembre de 2017 El doctor Krevestein El equipo eran tres. Maxi, un chico entusiasta y crédulo, usuario de un Arma Arcana viva, un revólver mitad mecánico mitad orgánico que podía adaptar su materia al cuerpo de Maxi y darle alas o un exoesqueleto de insecto; Irina insistía en que eso lo hacía un Maldito, y Maxi insistía en que no. E Irina, una mujer del parche en el ojo, danzarina de…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-11-22", "t": "Proyecto Arca · XXII. La caída de una estrella", "u": "/blog/2017/11/22/proyecto-arca-22-la-caida-de-una-estrella/", "r": "‹ Capítulo anterior: XXI. La vieja sangre · Índice El Viaje de Kendra · Daelvania y Arca, noviembre y diciembre de 2017 El mercenario -¿Quién te iba a decir a ti que encontrarías una diosa en este infierno? -le dijo Kendra al mercenario rubio. -Si eres una diosa, me convierto en tu adepto. No se me ocurre mejor modo de rendir culto que este. Lo que vino después fue una tarde robada al frío y a la guerra. El rubio era buen amante, generoso, atento, capaz de sostener el ritmo…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-12-08", "t": "Proyecto Arca · XXIII. El primer amigo", "u": "/blog/2017/12/08/proyecto-arca-23-el-primer-amigo/", "r": "‹ Capítulo anterior: XXII. La caída de una estrella · Índice El Viaje de Kendra · Arca, los recuerdos y diciembre de 2017 La fruta El recuerdo siguió. Anikura, en lugar de salir por la puerta, hizo que Kendra la siguiera por un camino que ella jamás habría escogido: trepando, colándose por la casa de un desconocido dormido. Romper su zona de confort, dijo, era el mejor modo de que Kendra viera quién era de verdad. Su zona de confort era seguir a otros; su padre la había…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2017-12-22", "t": "Proyecto Arca · XXIV. El corazón de Arca", "u": "/blog/2017/12/22/proyecto-arca-24-el-corazon-de-arca/", "r": "‹ Capítulo anterior: XXIII. El primer amigo · Índice El Viaje de Kendra · Arca, diciembre de 2017 y enero de 2018 El gato blanco El gato blanco no se dejó espantar. Se restregó entre las piernas de Kendra, le cortó el camino, y maulló insistente desde un callejón hasta que ella lo siguió, maldiciendo que hasta un gato le diera órdenes. La llevó por los barrios de Arca que la reconstrucción aún no había tocado, hasta una vivienda derruida. Entre los escombros, el gato se…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-01-08", "t": "Proyecto Arca · XXV. Volver a la vida", "u": "/blog/2018/01/08/proyecto-arca-25-volver-a-la-vida/", "r": "‹ Capítulo anterior: XXIV. El corazón de Arca · Índice El Viaje de Kendra · Arca, enero de 2018 La caída de Karthas Amelia tecleó hasta que un elevador subió a Abel desde el suelo, con las manos inmovilizadas y un collar metálico que le tapaba los ojos. Le quitaron los anclajes y las mordazas, y la cabeza de Nod se rio. -Mi pobre tío. Mira en lo que ha quedado. Kendra le ofreció a Abel algo distinto a lo que le daba Karthas: nada de cadenas ni celdas, colaboración mano a…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-01-22", "t": "Proyecto Arca · XXVI. Mi estrellita", "u": "/blog/2018/01/22/proyecto-arca-26-mi-estrellita/", "r": "‹ Capítulo anterior: XXV. Volver a la vida · Índice El Viaje de Kendra · Arca, enero y febrero de 2018 La casa de mis padres El cascabel llevó a Pandora, y Pandora llevó a Kendra, hasta la misma casa derruida de antes: la del retrato familiar. Ilidan esperaba dentro, encapuchado. -Porque no hay otros sitios a los que creo que deberías ir -le dijo, cuando Kendra le reprochó su insistencia-. Es importante que estés en paz contigo misma. Que no sea tu hogar no significa que no…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-02-08", "t": "Proyecto Arca · XXVII. Adán", "u": "/blog/2018/02/08/proyecto-arca-27-adan/", "r": "‹ Capítulo anterior: XXVI. Mi estrellita · Índice El Viaje de Kendra · Arca y las Doce Colinas, febrero de 2018 Las Sombras El banquete de bienvenida en la mansión Creew era abundante, con platos de las naciones de cada uno. Ilidan apenas comía; bebía y miraba con una sonrisa satisfecha a Reich y a Pandora, que lo mezclaba todo sin importarle qué fuera. Y, en mitad de la cena, Ilidan confesó algo que no quería que asustara a nadie. -Puedo controlar Engendros. Tengo varias…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-02-22", "t": "Proyecto Arca · XXVIII. No somos dioses", "u": "/blog/2018/02/22/proyecto-arca-28-no-somos-dioses/", "r": "‹ Capítulo anterior: XXVII. Adán · Índice El Viaje de Kendra · Izaro y Arca, febrero y marzo de 2018 Kilik Adán no era el dueño del niño; Kendra tendría que convencerlo a él. Así que se arrodilló a su altura y le habló de igual a igual: ella también era un Avatar, también había tenido a alguien que la obligaba a pelear, y nadie entendería mejor cómo se sentía. No lo llevaría a ningún sitio si no quería. -Vale -dijo el niño, y le dio la mano. Adán se llevó las manos a los…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-03-20", "t": "Proyecto Arca · XXIX. La canción de las estrellas", "u": "/blog/2018/03/20/proyecto-arca-29-la-cancion-de-las-estrellas/", "r": "‹ Capítulo anterior: XXVIII. No somos dioses · Índice El Viaje de Kendra · Izaro y Arca, marzo y abril de 2018 El páramo de Yedá El equipo que le tocó a Kendra eran los dos peores: Ax, sardónico, y Vina, insufrible. Más el soldado White, callado y disciplinado, y Pandora. Amelia le dio las llaves de un vehículo oruga acorazado, preparado por la Casa de la Rueda, con plataforma de salto propia y un pequeño arsenal. Kendra, que no sabía conducir nada, se las lanzó a White. El…", "g": ["proyecto-arca", "rol", "novela", "izaro"]}, {"f": "2018-04-25", "t": "Proyecto Arca · XXX. La fórmula de la felicidad", "u": "/blog/2018/04/25/proyecto-arca-30-la-formula-de-la-felicidad/", "r": "‹ Capítulo anterior: XXIX. La canción de las estrellas · Índice El Viaje de Kendra · Arca, abril y mayo de 2018 Alfred En una habitación de la enfermería en cuarentena, atado a una cama e intubado, estaba la última incorporación: Alfred, el Creew que Kendra había arrancado de Raignor. Un Avatar al que su madre había despojado de su Ascendido nada más nacer. Un borracho de un solo brazo, lo que quedaba del prometedor heredero. Kendra no fue amable. Le dijo lo que era: un niño…", "g": ["proyecto-arca", "ro
